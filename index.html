      // Blind-Signing Warnung
      var hw7b = msHwStatus(mb7b);
      if (hw7b.total > 0 && !hw7b.allOk) {
        tips.push({
          title: tr('Multisig „','Multisig "') + esc(msb7b.name || ('Multisig ' + (mb7b + 1))) + tr('": Wallet-Descriptor auf Hardware-Wallets registrieren','": register the wallet descriptor on hardware wallets'),
          body: tr('Bei','For') + ' <strong>' + esc(msb7b.name || ('Multisig ' + (mb7b + 1))) + '</strong> ' + tr('haben erst','only') + ' <strong>' + hw7b.registered + ' ' + tr('von','of') + ' ' + hw7b.total + '</strong> ' + tr('verknüpften Hardware-Wallets den Wallet-Descriptor registriert. Ohne registrierten Descriptor kann das Gerät die Empfänger- und Wechsel-Adressen nicht prüfen – du signierst dann praktisch <strong>blind</strong>. Empfehlung: den Wallet-Descriptor auf jeder Hardware-Wallet speichern/registrieren.','linked hardware wallets have registered the wallet descriptor. Without a registered descriptor, the device cannot verify recipient and change addresses – you are practically signing <strong>blind</strong>. Recommendation: store/register the wallet descriptor on every hardware wallet.'),
          warn: true
        });
      }
    }
  }

  // 11b. Seed ohne Backup oder nur SD-Karten-Backup → kritische Warnung
  (function() {
    for (var si = 0; si < state.seeds.length; si++) {
      var sd = state.seeds[si];
      var bks = sd.backups || [];
      if (bks.length === 0) {
        tips.push({
          title: tr('Seed-Phrase ohne Backup – akutes Verlustrisiko','Seed phrase without a backup – acute risk of loss'),
          body: (sd.name ? '<strong>' + esc(sd.name) + '</strong> ' + tr('hat','has') + ' ' : tr('Mindestens eine Seed-Phrase hat ','At least one seed phrase has ')) + '<strong>' + tr('kein einziges Backup','no backup at all') + '</strong>. ' + tr('Bei Verlust oder Zerstörung des Hardware-Wallets ist die Seed-Phrase unwiederbringlich verloren – und damit auch alle darauf liegenden Bitcoin. Ein Backup ist kein Optional, sondern zwingend erforderlich. Mindestens ein physisches Backup (Papier, reißfestes Papier oder Metall) sofort anlegen und in einem Tamper-Evident-Bag aufbewahren.','If the hardware wallet is lost or destroyed, the seed phrase is irretrievably lost – and with it all bitcoin stored on it. A backup is not optional, it is mandatory. Create at least one physical backup (paper, tear-resistant paper or metal) immediately and store it in a tamper-evident bag.') + (hasMultisig() ? ' <strong>' + tr('Besonders kritisch bei Multisig:','Especially critical with multisig:') + '</strong> ' + tr('Fehlt auch nur eine Seed-Phrase, kann das Multisig-Wallet nicht mehr vollständig wiederhergestellt werden.','If even one seed phrase is missing, the multisig wallet can no longer be fully restored.') : ''),
          warn: true,
          links: [
            {text: tr('Backup Stack (inkl. TerraPhrase + Bags)','Backup Stack (incl. TerraPhrase + bags)'), url: shopUrl('products/backup-stack')},
            {text: tr('Seedor Starter Set (Metall)','Seedor Starter Set (metal)'), url: shopUrl('products/seedor-starter-set')}
          ]
        });
        return;
      }
      var onlySd = bks.every(function(bk) { return bk.type === 'sd'; });
      if (onlySd && bks.length > 0) {
        tips.push({
          title: tr('Backup ausschließlich auf SD-Karte – unverschlüsselt und unsicher','Backup only on an SD card – unencrypted and insecure'),
          body: (sd.name ? '<strong>' + esc(sd.name) + '</strong>: ' : '') + tr('Dein aktuelles Backup liegt unverschlüsselt auf einer SD-Karte. Wer die Karte findet, kann potenziell die Seed-Phrase auslesen. Ein SD-Karten-Backup bietet weder physischen Schutz (Feuer, Wasser) noch kryptografische Sicherheit (Verschlüsselung, PIN-Schutz). Sicherer ist ein verschlüsseltes oder PIN-geschütztes Backup, z. B. über eine Smartcard/Secure-Element-Lösung. Eine mögliche Umsetzung ist Specter Shield Lite. Ergänzend sollte mindestens ein physisches Backup (Metall oder reißfestes Papier) in einem Tamper-Evident-Bag aufbewahrt werden.','Your current backup is stored unencrypted on an SD card. Anyone who finds the card can potentially read the seed phrase. An SD card backup offers neither physical protection (fire, water) nor cryptographic security (encryption, PIN protection). A safer option is an encrypted or PIN-protected backup, e.g. via a smartcard/secure-element solution. One possible implementation is Specter Shield Lite. In addition, at least one physical backup (metal or tear-resistant paper) should be stored in a tamper-evident bag.') + (hasMultisig() ? ' <strong>' + tr('Beachtung bei Multisig:','Note for multisig:') + '</strong> ' + tr('Ein kompromittiertes Backup bedeutet, dass ein Angreifer eine der benötigten Schlüssel erhalten kann – das senkt die Sicherheit des gesamten Multisig-Setups.','A compromised backup means an attacker may obtain one of the required keys – that lowers the security of the entire multisig setup.') : ''),
          warn: true,
          links: [
            {text: tr('Specter Shield Lite','Specter Shield Lite'), url: shopUrl('products/specter-shield-lite')},
            {text: tr('Specter Shield','Specter Shield'), url: shopUrl('products/specter-shield')},
            {text: tr('Backup Stack','Backup Stack'), url: shopUrl('products/backup-stack')}
          ]
        });
        return;
      }
    }
  })();

  // 12b. Alte Adressformate (Nested SegWit / Legacy) → Hinweis
  (function() {
    var oldFormats = [];
    for (var ai = 0; ai < state.addrTypes.length; ai++) {
      var at = state.addrTypes[ai];
      if (at.indexOf('Nested SegWit') >= 0 || at.indexOf('Legacy') >= 0) {
        oldFormats.push(at);
      }
    }
    if (oldFormats.length > 0) {
      var fmtNames = oldFormats.map(function(f) { return f.replace(/\s*\(.*\)/, ''); });
      tips.push({
        title: tr('Veraltete Adressformate erkannt: ','Legacy address formats detected: ') + esc(fmtNames.join(tr(' und ',' and '))),
        body: tr('Du verwendest ','You use ') + esc(fmtNames.join(tr(' und ',' and '))) + tr('-Adressen. Diese Adressformate sind technisch funktionstüchtig, gelten jedoch als veraltet: Sie verursachen höhere Transaktionsgebühren als Native SegWit und bieten eine geringere Datenschutzqualität (Input-Werte sind auf der Blockchain sichtbar). Für die Vererbung bedeutet dies zusätzlich: Dein Erbe muss beim Wiederherstellen genau den richtigen Adresstyp auswählen – ein falscher Adresstyp führt dazu, dass das Guthaben nicht angezeigt wird. Ein Wechsel auf Native SegWit (bc1q) oder Taproot (bc1p) reduziert die Gebühren, verbessert den Datenschutz und vereinfacht das Setup für die Erben erheblich. Ein Wechsel erfordert eine Transaktion auf die neuen Adressen.',' addresses. These address formats are technically functional but considered outdated: they cause higher transaction fees than Native SegWit and offer lower privacy quality (input values are visible on the blockchain). For inheritance this also means: your heir must select exactly the right address type when restoring – a wrong address type means the balance will not appear. Switching to Native SegWit (bc1q) or Taproot (bc1p) reduces fees, improves privacy and greatly simplifies the setup for heirs. A switch requires a transaction to the new addresses.'),
        links: [
          {text: tr('Beratung zum Adressformat-Wechsel','Consultation on changing the address format'), url: shopUrl('security-talk')}
        ]
      });
    }
  })();

  // ── Erweiterte Tipps ──────────────────────────────────────────────────

  // A1. Specter DIY Snapcase mit Seed-Speicherung → Upgrade auf Specter Shield Lite (Secure Element)
  var showsShieldLiteRec = false;
  for (var i = 0; i < state.devices.length; i++) {
    if (state.devices[i].model === 'Specter DIY Snapcase') {
      var dv = state.devices[i];
      var sd = dv.model && dv.model.indexOf('Specter DIY') >= 0;
      // Zeige Empfehlung wenn: Seed auf diesem Gerät mit SD-Karte verschlüsselt ODER als Smartcard gespeichert
      if (dv.companions && dv.companions.length) {
        showsShieldLiteRec = true;
        break;
      }
      // ODER: Wenn irgendwo im Seed-Speicher dieses Gerät mit SD-Karte oder Smartcard verknüpft ist
      for (var si = 0; si < state.seeds.length; si++) {
        var sd2 = state.seeds[si];
        if (sd2 && sd2.devices && sd2.devices.indexOf(i) >= 0) {
          var opts = sd2.deviceOpts && sd2.deviceOpts[i];
          if (opts && (opts.sdCard || opts.withSc)) {
            showsShieldLiteRec = true;
            break;
          }
        }
      }
    }
    if (showsShieldLiteRec) break;
  }
  if (showsShieldLiteRec) {
    tips.push({
      title: tr('Upgrade auf Specter Shield Lite: austauschbares Secure Element','Upgrade to Specter Shield Lite: replaceable secure element'),
      body: tr('Du nutzt einen Specter DIY Snapcase. Ohne Shield speichert das Gerät die Seed-Phrase im internen Flash-Speicher – ohne PIN-Schutz auf Hardware-Ebene. Mit dem Upgrade Kit rüstest du einen Secure Element per Smartcard nach: Die Seed-Phrase wird dann PIN-geschützt auf der Karte gespeichert und ist deutlich sicherer gegen physischen Zugriff.','You use a Specter DIY Snapcase. Without a Shield, the device stores the seed phrase in internal flash memory – without hardware-level PIN protection. With the Upgrade Kit you add a secure element via smartcard: the seed phrase is then stored PIN-protected on the card and is significantly safer against physical access.'),
      links: [
        {text: tr('Specter Shield Lite Upgrade Kit','Specter Shield Lite Upgrade Kit'), url: shopUrl('products/specter-shield-lite-upgrade-kit')},
        {text: tr('Specter Shield Lite','Specter Shield Lite'), url: shopUrl('products/specter-shield-lite')},
        {text: tr('Specter Shield','Specter Shield'), url: shopUrl('products/specter-shield')}
      ],
      advanced: true
    });
  }

  if (anyBackupType('sd')) {
    tips.push({ title:L('secTitle12'), body:L('secBody12'), links:[
      {text:'Specter Shield Lite', url:shopUrl('products/specter-shield-lite')},
      {text:'Specter Shield', url:shopUrl('products/specter-shield')}
    ], advanced:true });
  }

  return tips;
}

// ===== Wallet-Descriptor: Wo ist er gesichert? (nur Offline-Modus) =====
// Stellt sicher, dass aeltere/teilweise Multisig-Objekte die Descriptor-Backup-Felder besitzen.
function ensureMsDb(ms){
  if(!ms.dbDevices)ms.dbDevices=[];
  if(!ms.dbBackups)ms.dbBackups=[];
  if(ms.dbPwm==null)ms.dbPwm=false;
  if(ms.dbBook==null)ms.dbBook=false;
  if(ms.companion==null)ms.companion="";
  if(ms.companionPc==null)ms.companionPc=false;
  if(ms.dbExp==null)ms.dbExp=false;
  if(ms.descriptorInPasswordManager==null)ms.descriptorInPasswordManager=false;
  if(!ms.descriptorLoadedOnHardwareWallets)ms.descriptorLoadedOnHardwareWallets={};
  return ms;
}
// Hardware-Wallets (Index in state.devices), die ueber die Seeds zu diesem Multisig gehoeren.
function msDeviceIdxs(i){
  var ms=state.multisigs[i], out=[], seen={};
  for(var k=0;k<ms.seeds.length;k++){ var s=state.seeds[ms.seeds[k]]; if(!s) continue;
    for(var d=0;d<(s.devices||[]).length;d++){ var di=s.devices[d]; if(state.devices[di] && !seen[di]){ seen[di]=1; out.push(di); } } }
  return out;
}
// Alle Seed-Phrase-Backups der Seeds dieses Multisigs (mit eindeutigem Schluessel "seedIdx:backupIdx").
function msBackupRefs(i){
  var ms=state.multisigs[i], out=[];
  for(var k=0;k<ms.seeds.length;k++){ var si=ms.seeds[k], s=state.seeds[si]; if(!s) continue;
    for(var b=0;b<(s.backups||[]).length;b++){ out.push({si:si,bi:b,key:si+":"+b,label:(s.name||"Seed "+(si+1))+" – Backup "+(b+1)}); } }
  return out;
}
// PFLICHT-Logik (Wallet-Descriptor-Backup):
// Eine Seed-Phrase ist "vollständig gesichert", wenn ALLE ihre Backups einen Wallet-Descriptor beiliegen haben.
function seedFullyBacked(i, si){
  var ms=state.multisigs[i]; ensureMsDb(ms); var s=state.seeds[si];
  if(!s || (s.backups||[]).length===0) return false;
  for(var b=0;b<s.backups.length;b++){
    if(ms.dbBackups.indexOf(si+":"+b)>=0) continue;
    if(s.backups[b] && s.backups[b].descriptorWithBackup) continue;
    return false;
  }
  return true;
}
function msFullBackedCount(i){ var ms=state.multisigs[i], c=0; for(var k=0;k<ms.seeds.length;k++){ if(seedFullyBacked(i,ms.seeds[k])) c++; } return c; }
function msAllSeedsFullyBacked(i){ var ms=state.multisigs[i]; if(ms.seeds.length===0) return false; for(var k=0;k<ms.seeds.length;k++){ if(!seedFullyBacked(i,ms.seeds[k])) return false; } return true; }
function msReqFull(i){ var ms=state.multisigs[i]; var r=(ms.n||1)-(ms.m||1)+1; if(r<1)r=1; if(r>ms.n)r=ms.n; return r; }
function msAnyDescriptor(i){ var ms=state.multisigs[i]; ensureMsDb(ms); return ms.dbDevices.length>0 || ms.dbBackups.length>0 || ms.dbPwm || ms.dbBook || ms.companionPc; }
function msHwStatus(i){
  var devs=msDeviceIdxs(i), reg=0;
  ensureMsDb(state.multisigs[i]);
  for(var d=0;d<devs.length;d++){ if(state.multisigs[i].dbDevices.indexOf(devs[d])>=0) reg++; }
  return {total:devs.length, registered:reg, allOk:devs.length>0 && reg===devs.length};
}

// Bewertung des Descriptor-Backups (Seed-Phrase-Backups als Pflicht).
// NEUE REGEL:
// 1. Hardware-Wallet-Descriptor zaehlt NICHT als Seed-Phrase-Backup.
// 2. Eine Seed-Phrase ist "komplett descriptor-gebackupt" wenn ALLE ihre Backups descriptorWithBackup=true haben.
// 3. Ohne externen Cosigner: min. m Seed-Phrasen muessen komplett sein.
// 4. MIT externem Cosigner: jedes eigene Seedphrase-Backup MUSS den Descriptor haben.
// 5. Keine positive Meldung mehr wenn alles ok - nur Fehlermeldungen anzeigen.
function msDescStatus(i){
  var ms=state.multisigs[i]; ensureMsDb(ms);
  var m=ms.m||1, n=ms.n||1;

  function seedHasDescriptorOnAllBackups(si){
    var sd=state.seeds[si];
    if(!sd || !sd.backups || sd.backups.length===0) return false;
    for(var b=0;b<sd.backups.length;b++){
      if(ms.dbBackups.indexOf(si+":"+b)>=0) continue;
      if(sd.backups[b] && sd.backups[b].descriptorWithBackup) continue;
      return false;
    }
    return true;
  }

  var completeSeeds=[], incompleteSeeds=[];
  for(var k=0;k<ms.seeds.length;k++){
    var si=ms.seeds[k];
    if(seedHasDescriptorOnAllBackups(si)){ completeSeeds.push(si); }
    else { incompleteSeeds.push(si); }
  }

  // Sonderfall: externer Cosigner vorhanden.
  if(ms.cosigners && ms.cosigners.length>0){
    if(incompleteSeeds.length>0){
      return {
        level:"err", covered:completeSeeds.length, need:n,
        msg:'<strong>'+tr('Wallet-Descriptor wird ungenügend abgesichert.','The wallet descriptor is insufficiently backed up.')+'</strong> '+tr('Empfehlung dazu am Ende unter „Tipps zur Bitcoin-Sicherheit“.','See the recommendation at the end under "Bitcoin security tips".')
      };
    }
    // Alles ok bei Cosigner - keine Warnung anzeigen
    return {level:"ok", covered:completeSeeds.length, need:m, msg:''};
  }

  // Normale m-of-n-Regel (ohne externen Cosigner).
  var requiredCompleteSeeds = m;

  if(completeSeeds.length < requiredCompleteSeeds){
    // gar kein oder zu wenig Descriptor
    var none=!msAnyDescriptor(i);
    var noBackupAtAll=completeSeeds.length===0 && (!ms.dbDevices.length && !ms.dbBackups.length && !ms.dbPwm && !ms.dbBook && !ms.companionPc);
    return {level:"err", covered:completeSeeds.length, need:requiredCompleteSeeds,
      msg:noBackupAtAll
        ? tr('Wallet-Descriptor wird ungenügend abgesichert. Empfehlung dazu am Ende unter „Tipps zur Bitcoin-Sicherheit“.','The wallet descriptor is insufficiently backed up. See the recommendation at the end under "Bitcoin security tips".')
        : tr('Wallet-Descriptor wird mangelhaft abgesichert. Empfehlung dazu am Ende unter „Tipps zur Bitcoin-Sicherheit“.','The wallet descriptor is poorly backed up. See the recommendation at the end under "Bitcoin security tips".')};
  }

  // Genug komplette Seeds vorhanden, aber nicht alle.
  if(incompleteSeeds.length>0){
    // Pruefe ob es einen Fallback-Ort gibt (Passwortmanager oder HW-Descriptor)
    var hasPwm=ms.descriptorInPasswordManager;
    var hasHwDesc=false;
    for(var k=0;k<incompleteSeeds.length;k++){
      var si2=incompleteSeeds[k];
      var sd2=state.seeds[si2];
      if(sd2 && sd2.devices && ms.descriptorLoadedOnHardwareWallets){
        for(var d=0;d<sd2.devices.length;d++){ if(ms.descriptorLoadedOnHardwareWallets[sd2.devices[d]]) hasHwDesc=true; }
      }
    }
    // Wenn Fallback (PW-Manager oder HW) vorhanden: OK, keine Warnung
    if(hasPwm || hasHwDesc){
      return {level:"ok", covered:completeSeeds.length, need:requiredCompleteSeeds, msg:''};
    }
    // Kein Fallback: Warnung grenzwertig
    return {level:"warn", covered:completeSeeds.length, need:requiredCompleteSeeds,
      msg:tr('Wallet-Descriptor wird grenzwertig redundant abgesichert. Empfehlung dazu am Ende unter „Tipps zur Bitcoin-Sicherheit“.','The wallet descriptor is only marginally redundantly backed up. See the recommendation at the end under "Bitcoin security tips".')};
  }

  // Alles perfekt - keine Meldung mehr
  return {level:"ok", covered:completeSeeds.length, need:m, msg:''};
}

// UI-Funktionen für Descriptor-Backup-Tracking
function toggleMsDbExp(i){ var ms=ensureMsDb(state.multisigs[i]); ms.dbExp=!ms.dbExp; render(); }

  h += '</div>';

// ===== GLOSSARY CONDITIONS =====
// Each glossary entry should only print if the concept it explains actually appears
// somewhere else in this PDF - otherwise heirs are handed definitions for things
// (e.g. Multisig) that were never used. These helpers mirror the exact conditions
// under which each concept is printed elsewhere in buildAndPrint().
function exchangeAt(i){ var nm=state.ex.names[i]; for(var z=0;z<EXCHANGES.length;z++){ if(EXCHANGES[z].label===nm) return EXCHANGES[z]; } return null; }
function hasKycFull(){ for(var i=0;i<state.ex.count;i++){ var ex=exchangeAt(i); if(ex && ex.kyc && ex.kycFull) return true; } return false; }
function hasKycLite(){ for(var i=0;i<state.ex.count;i++){ var ex=exchangeAt(i); if(ex && ex.kyc && !ex.kycFull) return true; } return false; }
function hasNoKyc(){ for(var i=0;i<state.ex.count;i++){ var ex=exchangeAt(i); if(ex && !ex.kyc) return true; } return false; }
function hasSeedPhraseConcept(){
  if(state.seeds.length>0) return true;
  if(state.sw.pc>0 || state.sw.phone>0) return true;
  for(var i=0;i<state.ex.count;i++){ var ex=exchangeAt(i); if(ex && ex.hasSeed) return true; }
  return false;
}
function hasSmartcardUsed(){ for(var i=0;i<state.devices.length;i++){ var dv=state.devices[i]; var m=getModel(dv.model); if(m && m.shield && dv.smartcards>0) return true; } return false; }
function hasAntiPhishingUsed(){ for(var i=0;i<state.devices.length;i++){ var m=getModel(state.devices[i].model); if(m && m.antiPhish) return true; } return false; }
function hasPassphraseUsed(){ for(var i=0;i<state.seeds.length;i++){ if(state.seeds[i].passphrases>0) return true; } return false; }
function hasDescriptorConcept(){ return state.multisigs.length>0 || (state.lianaWallets.length>0 && anyLianaCompanion()); }
function hasMultisigConcept(){ return state.multisigs.length>0 || (state.lianaMode==="multi" && state.lianaWallets.length>0 && anyLianaCompanion()); }
function hasLockIconUsed(){ return state.devices.length>0 || state.ex.count>0 || hasPassphraseUsed() || state.pwm.use===true || (state.dig.use===true && !!state.dig.enc); }

// ===== PDF BUILD =====
// Guard against re-entrant calls: a double-click (or a click while the previous
// print dialog is still open/rendering) used to fire buildAndPrint() twice, racing
// two innerHTML writes and two window.print() calls against the same #pdf-body -
// the print preview then showed a half-built document that "broke off" once you
// scrolled it. The flag is released once the print dialog has actually opened
// (afterprint) or, as a fallback, after a timeout in case afterprint never fires.
var pdfBuildInProgress = false;
function buildAndPrint(){
  if(pdfBuildInProgress) return;
  pdfBuildInProgress = true;
  var releaseGuard = function(){ pdfBuildInProgress = false; };
  window.addEventListener("afterprint", releaseGuard, {once:true});
  setTimeout(releaseGuard, 15000);
  var h='';
  // 1. General

  h+='<h2 class="pdf-h2">'+L('pdfGeneralInfo')+'</h2>';

    if((ct.note||"").trim()){ h+='<div style="margin-top:4pt;"><em class="c-label">'+L('pdfContactRelLabel')+'</em> <span class="c-val">'+esc(ct.note)+'</span></div>'; }
    else { h+='<em class="c-label">'+L('pdfContactRelLabel')+'</em><span class="pdf-field-line-wide"></span>'; }
    h+='</div>';
  }
  // Glossary - each entry is gated on the corresponding hasXxx() condition so heirs
  // never get a definition for a concept (Multisig, KYC, ...) that isn't actually
  // used anywhere else in this particular PDF.
  var gHw = state.devices.length>0;
  var gSw = state.sw.pc>0 || state.sw.phone>0;
  var gEx = state.ex.count>0;
  var gKycFull = hasKycFull();
  var gKycLite = hasKycLite();
  var gNoKyc = hasNoKyc();
  var gSeed = hasSeedPhraseConcept();
  var gBag = state.seeds.length>0;
  var gSmartcard = hasSmartcardUsed();
  var gAntiPhish = hasAntiPhishingUsed();
  var gPassphrase = hasPassphraseUsed();
  var gAccount = state.seeds.length>0;
  var gAddrType = state.seeds.length>0;
  var gFingerprint = state.seeds.length>0;
  var gDescriptor = hasDescriptorConcept();
  var gMultisig = hasMultisigConcept();
  var g2fa = gEx;
  var gLock = hasLockIconUsed();
  h+='<h3 class="pdf-h3">'+L('pdfGlossary')+'</h3><dl class="pdf-gloss">';
  if(LANG==='de'){
    h+='<dt>Wallet</dt><dd>Software oder Ger&auml;t, das die privaten Schl&uuml;ssel zu euren Bitcoin verwaltet und damit Transaktionen erm&ouml;glicht. Sie speichert kein Bitcoin selbst, sondern nur den Zugriffsschl&uuml;ssel darauf.</dd>';

// ===== SPEICHERN / LADEN (JSON) =====
// New files use 600,000 rounds (OWASP 2023 for PBKDF2-HMAC-SHA256). Files written by older versions carry
// their own count in the header (210,000) and are still readable. The header value is bounded so a crafted
// file cannot make the browser hang.
var PBKDF2_ITER = 600000, PBKDF2_ITER_MIN = 100000, PBKDF2_ITER_MAX = 5000000;
var BACKUP_MIN_PASSWORD = 10, MAX_IMPORT_BYTES = 2 * 1024 * 1024;
function iterationsFor(env){
  var n = env && env.iterations;
  return (typeof n === "number" && isFinite(n) && n >= PBKDF2_ITER_MIN && n <= PBKDF2_ITER_MAX) ? Math.floor(n) : 210000;
}
// Base64 <-> ArrayBuffer
function ab2b64(buf){ var b=new Uint8Array(buf), s=""; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b642ab(b64){ var s=atob(b64), len=s.length, u=new Uint8Array(len); for(var i=0;i<len;i++) u[i]=s.charCodeAt(i); return u.buffer; }
function cryptoOK(){ return (typeof crypto!=="undefined") && crypto.subtle && typeof crypto.getRandomValues==="function"; }
function deriveKey(password, salt, usage, iterations){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(password), {name:"PBKDF2"}, false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:salt, iterations:iterations||PBKDF2_ITER, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, usage);
    });
}
// Verschluesselt den aktuellen state -> Envelope-Objekt
function encryptState(password){
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var plain = new TextEncoder().encode(JSON.stringify(state));
  return deriveKey(password, salt, ["encrypt"]).then(function(key){
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, plain);
  }).then(function(ct){
    return { app:"clavastack-nachlassplan", version:1, enc:"AES-GCM", kdf:"PBKDF2-SHA256",
             iterations:PBKDF2_ITER, savedAt:new Date().toISOString(),
             salt:ab2b64(salt), iv:ab2b64(iv), ciphertext:ab2b64(ct) };
  });
}
// Entschluesselt ein Envelope-Objekt -> state-Objekt (wirft bei falschem Passwort)
function decryptState(password, env){
  var salt = new Uint8Array(b642ab(env.salt));
  var iv = new Uint8Array(b642ab(env.iv));
  return deriveKey(password, salt, ["decrypt"], iterationsFor(env)).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, b642ab(env.ciphertext));
  }).then(function(buf){
    return JSON.parse(new TextDecoder().decode(buf));
  });
}

// ---- Passwort-Modal: Promise<string|null> (null = Abbruch) ----

function askPassword(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var ov = document.createElement("div"); ov.className = "modal-overlay modal-center";
    var confirmField = opts.confirm
      ? '<input type="password" id="pw-confirm" placeholder="'+L('passwordRepeatPh')+'" autocomplete="new-password">' : '';
    ov.innerHTML =
      '<div class="modal-box">'
      +'<h3>'+esc(opts.title||L('passwordLabel'))+'</h3>'
      +'<p>'+esc(opts.text||"")+'</p>'
      +'<input type="password" id="pw-input" placeholder="'+L('passwordLabel')+'" autocomplete="'+(opts.confirm?"new-password":"current-password")+'">'
      +confirmField
      +'<div class="modal-err" id="pw-err"></div>'
      +'<div class="modal-actions">'
      +'<button class="btn btn-ghost" id="pw-cancel">'+L('cancelLabel')+'</button>'
      +'<button class="btn btn-primary" id="pw-ok">'+esc(opts.okLabel||"OK")+'</button>'
      +'</div></div>';
    document.body.appendChild(ov);
    setTimeout(function(){ ov.querySelector(".modal-box").classList.add("modal-visible"); }, 16);
    var inp = ov.querySelector("#pw-input");
    var conf = ov.querySelector("#pw-confirm");
    var err = ov.querySelector("#pw-err");
    function close(val){ document.body.removeChild(ov); resolve(val); }
    function submit(){
      var v = inp.value;
      if(!v){
        if(opts.allowEmpty){
          if(opts.confirm && conf && conf.value){ err.textContent = L('passwordMismatch'); return; }
          close(v);
          return;
        }
        err.textContent = L('enterPassword'); return;
      }
      if(opts.minLen && v.length < opts.minLen){ err.textContent = Lf('minLen',opts.minLen); return; }
      if(opts.confirm && v !== conf.value){ err.textContent = L('passwordMismatch'); return; }
      close(v);
    }
    ov.querySelector("#pw-ok").onclick = submit;
    ov.querySelector("#pw-cancel").onclick = function(){ close(null); };
    ov.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); else if(e.key==="Escape") close(null); });
    ov.addEventListener("mousedown", function(e){ if(e.target===ov) close(null); });
    setTimeout(function(){ inp.focus(); }, 30);
  });
}
// ---- Kurzer Hinweis (Toast) ----
function showToast(msg, kind){
  var t = document.createElement("div");
  t.className = "toast " + (kind==="err" ? "toast-err" : "toast-ok");
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add("toast-show"); });
  setTimeout(function(){
    t.classList.remove("toast-show");
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, Math.min(6000, 2200 + String(msg == null ? "" : msg).length * 40));
}

function triggerDownload(text, fname){
  var blob = new Blob([text], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

    confirm:true, allowEmpty:true, minLen:BACKUP_MIN_PASSWORD, okLabel:L('saveLabel')
  }).then(function(pw){
    if(pw===null) return;
    var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
    var fname = "clavastack-inheritance-plan-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+".json";
    if(pw===""){
      if(!window.confirm(LANG==='de' ? 'Möchtest du es unverschlüsselt speichern?' : 'Do you want to save it unencrypted?')) return;
      triggerDownload(JSON.stringify(state, null, 2), fname);
      showToast(LANG==='de' ? 'Plan unverschlüsselt gespeichert' : 'Plan saved unencrypted');
      return;
    }
    if(!cryptoOK()){ alert(L('cryptoMissingSave')); return; }
    return encryptState(pw).then(function(env){
      triggerDownload(JSON.stringify(env, null, 2), fname);
      showToast(LANG==='de' ? 'Plan verschlüsselt gespeichert' : 'Plan saved encrypted');
    });
  }).catch(function(e){ alert("Save failed: "+e.message); });
}
// ---- Import: a loaded file is never trusted ----
// Keeps only what the planner knows, forces every field to the type of its default and caps list sizes.
// Unknown keys are dropped (also __proto__), wrong types fall back to the default value.
var IMPORT_MAX_ITEMS = 200;
function conformTo(value, tpl, depth){
  if(Array.isArray(tpl)){
    return Array.isArray(value) ? value.slice(0, IMPORT_MAX_ITEMS) : tpl.slice();
  }
  if(tpl && typeof tpl === "object"){
    var src = (value && typeof value === "object" && !Array.isArray(value)) ? value : {};
    var out = {};
    Object.keys(tpl).forEach(function(k){ out[k] = depth > 0 ? conformTo(src[k], tpl[k], depth - 1) : (src[k] === undefined ? tpl[k] : src[k]); });
    // objects used as maps (acc, pur, deviceOpts ...) are not part of the template and are carried over as plain data
    Object.keys(src).forEach(function(k){ if(k !== "__proto__" && k !== "constructor" && k !== "prototype" && !(k in out)) out[k] = src[k]; });
    return out;
  }
  if(tpl === null){
    return (value === null || ["string","number","boolean"].indexOf(typeof value) >= 0) ? value : null;
  }
  if(typeof tpl === "number" && typeof value === "string" && value.trim() !== "" && isFinite(Number(value))) return Number(value);
  if(typeof tpl === "string" && typeof value === "number" && isFinite(value)) return String(value);
  return typeof value === typeof tpl ? value : tpl;
}
function conformList(list, factory, depth){
  if(!Array.isArray(list)) return [];
  return list.slice(0, IMPORT_MAX_ITEMS).filter(function(it){ return it && typeof it === "object" && !Array.isArray(it); })
    .map(function(it){ return conformTo(it, factory(), depth); });
}
function normalizeLoadedState(loaded){
  var base = defaultState(), src = (loaded && typeof loaded === "object" && !Array.isArray(loaded)) ? loaded : {};
  var out = conformTo(src, base, 2);
  out.contacts = conformList(src.contacts, function(){ return {info:"", note:""}; }, 1);
  out.devices = conformList(src.devices, newDevice, 1);
  out.seeds = conformList(src.seeds, newSeed, 1).map(function(sd){
    sd.backups = conformList(sd.backups, newBackup, 1);
    var w = conformTo(sd.wallet, newWallet(), 1); sd.wallet = w;
    sd.pp = conformList(sd.pp, newWallet, 1);
    return sd;
  });
  out.multisigs = conformList(src.multisigs, newMultisig, 1);
  out.lianaWallets = conformList(src.lianaWallets, newLianaWallet, 1);
  out.devices.forEach(function(dv){ dv.companions = conformList(dv.companions, newCompanion, 1); });
  return out;
}
function applyLoadedState(loaded){
  state = normalizeLoadedState(loaded);
  pos = screens().length - 1; render(); window.scrollTo(0,0);
  showToast(L('planLoaded'));
}

function openLoadModal(){
  var ov = document.createElement("div"); ov.className = "modal-overlay";
  var pwFieldStyle = 'width:100%;padding:11px 13px;margin-bottom:4px;background:var(--specter-dark-accent);border:1px solid #2a3a4a;border-radius:var(--radius);color:var(--specter-light);font-family:inherit;font-size:0.92rem;box-sizing:border-box;';
  ov.innerHTML =
    '<div class="modal-box load-modal-box" id="load-modal-box">'
    +'<h3>'+L('loadPlan')+'</h3>'
    +'<p>'+L('loadDropHint')+'</p>'
    +'<div class="load-dropzone" id="load-dz" onclick="document.getElementById(\'load-modal-file\').click()">'
    +'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>'
    +'<div class="load-dropzone-label"><strong>'+L('dropHere')+'</strong><br>'+L('orClick')+' &nbsp;&#183;&nbsp; .json</div>'
    +'</div>'
    +'<input type="file" id="load-modal-file" accept="application/json,.json" style="display:none">'
    +'<div class="load-pw-section" id="load-pw-section" style="display:none">'
    +'<label style="font-size:0.82rem;color:var(--specter-light-secondary);display:block;margin-bottom:6px;">&#128274; '+L('passwordLabel')+'</label>'
    +'<input type="password" id="load-pw-input" placeholder="'+L('passwordLabel')+'" autocomplete="current-password" style="'+pwFieldStyle+'">'
    +'</div>'
    +'<div class="modal-err" id="load-modal-err"></div>'
    +'<div class="modal-actions">'
    +'<button class="btn btn-ghost" id="load-cancel">'+L('cancelLabel')+'</button>'
    +'<button class="btn btn-primary" id="load-ok" disabled>'+L('loadLabel')+'</button>'
    +'</div></div>';
  document.body.appendChild(ov);
  setTimeout(function(){ ov.querySelector("#load-modal-box").classList.add("modal-visible"); }, 16);

  var dz = ov.querySelector("#load-dz");
  var fileInput = ov.querySelector("#load-modal-file");
  var pwSection = ov.querySelector("#load-pw-section");
  var pwInput = ov.querySelector("#load-pw-input");
  var errEl = ov.querySelector("#load-modal-err");
  var okBtn = ov.querySelector("#load-ok");
  var selectedFile = null;
  var isEncrypted = false;

  function close(){ document.body.removeChild(ov); }

  function peekFile(file){
    var r = new FileReader();
    r.onload = function(){
      try{
        var p = JSON.parse(r.result);
        isEncrypted = !!(p && p.enc === "AES-GCM");
      } catch(e){ isEncrypted = false; }
      if(isEncrypted){
        pwSection.style.display = "";
        setTimeout(function(){ pwInput.focus(); }, 30);
      } else {
        pwSection.style.display = "none";
      }
    };
    r.readAsText(file);
  }

  function setFile(file){
    if(file.size > MAX_IMPORT_BYTES){ errEl.textContent = L('notValidFile'); return; }
    selectedFile = file;
    dz.classList.add("has-file");
    dz.querySelector(".load-dropzone-label").innerHTML = '<strong>'+esc(file.name)+'</strong><br><span style="font-size:0.78rem;opacity:0.7;">'+Math.round(file.size/1024*10)/10+' KB</span>';
    okBtn.disabled = false;
    errEl.textContent = "";
    peekFile(file);
  }

  dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", function(){ dz.classList.remove("dragover"); });
  dz.addEventListener("drop", function(e){
    e.preventDefault(); dz.classList.remove("dragover");
    var f = e.dataTransfer.files[0];
    if(f) setFile(f);
  });
  fileInput.addEventListener("change", function(){
    if(fileInput.files[0]) setFile(fileInput.files[0]);
    fileInput.value = "";
  });

  ov.querySelector("#load-cancel").onclick = close;
  ov.addEventListener("mousedown", function(e){ if(e.target===ov) close(); });
  ov.addEventListener("keydown", function(e){ if(e.key==="Escape") close(); });

  function doLoad(parsed){
    if(parsed && parsed.enc === "AES-GCM"){
      if(!cryptoOK()){ alert(L('cryptoMissing')); return; }
      var pw = pwInput.value;
      if(!pw){ errEl.textContent = L('enterPassword'); pwInput.focus(); return; }
      decryptState(pw, parsed).then(function(loaded){
        if(!loaded || typeof loaded !== "object") throw new Error("empty");
        close(); applyLoadedState(loaded);
      }).catch(function(){
        errEl.textContent = L('wrongPassword'); pwInput.select(); pwInput.focus();
      });
    } else {
      close(); applyLoadedState(parsed);
    }
  }

  okBtn.onclick = function(){
    if(!selectedFile) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ errEl.textContent = L('notValidFile'); return; }
      doLoad(parsed);
    };
    reader.readAsText(selectedFile);
  };
  pwInput.addEventListener("keydown", function(e){ if(e.key==="Enter") okBtn.click(); });
}

function loadPlan(input){
  var file = input && input.files && input.files[0];
  if(!file) return;
  if(file.size > MAX_IMPORT_BYTES){ alert(L('notValidFile')); return; }
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert(L('notValidFile')); return; }
    if(parsed && parsed.enc === "AES-GCM"){
      if(!cryptoOK()){ alert(L('cryptoMissing')); return; }
      var attempt = function(){
        askPassword({ title:L('decryptTitle'), text:L('decryptText'), okLabel:L('loadLabel') })
          .then(function(pw){
            if(pw===null) return;
            decryptState(pw, parsed).then(function(loaded){
              if(!loaded || typeof loaded !== "object") throw new Error("empty");
              applyLoadedState(loaded);
            }).catch(function(){
              showToast(L('wrongPassword'), "err");
              attempt();
            });
          });
      };
      attempt();
    } else if(parsed && typeof parsed.state === "object" && parsed.state){
      applyLoadedState(parsed.state);
    } else if(parsed && (Array.isArray(parsed.devices) || Array.isArray(parsed.seeds)) && typeof parsed === "object"){
      applyLoadedState(parsed);   // state object saved without encryption
    } else {
      alert(L('noValidPlan'));
    }
  };
  reader.onerror = function(){ alert(L('fileReadError')); };
  reader.readAsText(file);
}

 registerOfflineSupport();
