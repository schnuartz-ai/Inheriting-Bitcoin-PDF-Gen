<style>

:root {
  --specter-dark: #04070B;
  --specter-dark-secondary: #1E2734;
  --specter-dark-accent: #0C1A27;
  --specter-primary: #1F99E5;
  --specter-coral: #FF7A7A;
  --specter-danger: #E33630;
  --specter-light: #E8EFF5;
  --specter-light-secondary: #8BA0B4;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Roboto', system-ui, sans-serif; background: var(--specter-dark); color: var(--specter-light); min-height: 100vh; }
.app-header { background: var(--specter-dark-secondary); border-bottom: 1px solid #2a3a4a; padding: 0 32px; height: 60px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 50; }
.app-header img { height: 32px; }
.app-header-title { font-size: 1.1rem; font-weight: 700; color: var(--specter-light); letter-spacing: 0.5px; }
.app-header-offline { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.app-header-offline-badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: rgba(31,153,229,0.12); color: #bfe3fb; border: 1px solid rgba(31,153,229,0.35); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; appearance: none; cursor: pointer; font-family: inherit; transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s; }
.app-header-offline-badge::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--specter-primary); box-shadow: 0 0 0 4px rgba(31,153,229,0.15); }
.app-header-offline-badge:hover { transform: translateY(-1px); }
.app-header-offline-badge.is-ready { background: rgba(65,198,122,0.12); color: #c8f9da; border-color: rgba(65,198,122,0.35); }
.app-header-offline-badge.is-ready::before { background: #41c67a; box-shadow: 0 0 0 4px rgba(65,198,122,0.15); }
.app-header-offline-badge.is-checking { background: rgba(139,160,180,0.12); color: #d5e2ee; border-color: rgba(139,160,180,0.3); }
.app-header-offline-badge.is-checking::before { background: #8ba0b4; box-shadow: 0 0 0 4px rgba(139,160,180,0.12); }
.offline-status-check { font-weight: 800; margin-left: 2px; }
.btn-offline-mini { padding: 8px 12px; font-size: 0.74rem; border-radius: 999px; }
.wizard-content { max-width: 820px; margin: 32px auto; padding: 0 24px 60px; }
.warning-banner { background: rgba(227,54,48,0.12); border: 2px solid var(--specter-coral); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; display: flex; gap: 14px; align-items: flex-start; }
.warning-banner-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; }
.warning-banner-text { font-size: 0.85rem; line-height: 1.6; color: #FFB3B3; }
.warning-banner-text strong { color: var(--specter-coral); display: block; font-size: 0.92rem; margin-bottom: 4px; }
.warning-banner.warning-yellow { background: rgba(245,180,30,0.12); border-color: #f5b41e; }
.warning-banner.warning-yellow .warning-banner-text { color: #e8d9b0; }
.warning-banner.warning-yellow .warning-banner-text strong { color: #f5b41e; }
.section-card { background: var(--specter-dark-secondary); border-radius: var(--radius); border: 1px solid #2a3a4a; margin-bottom: 24px; overflow: hidden; }
.section-card-header { padding: 18px 24px; border-bottom: 1px solid #2a3a4a; }
.section-card-title { font-size: 1rem; font-weight: 700; color: var(--specter-primary); }
.section-card-body { padding: 24px; }
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--specter-light-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
.form-control { width: 100%; background: var(--specter-dark-accent); border: 1px solid #2a3a4a; border-radius: var(--radius); padding: 10px 14px; color: var(--specter-light); font-family: 'Roboto', system-ui, sans-serif; font-size: 0.9rem; transition: border-color 0.2s; }
.form-control:focus { outline: none; border-color: var(--specter-primary); box-shadow: 0 0 0 3px rgba(31,153,229,0.15); }
select.form-control option { background: var(--specter-dark-accent); }
.radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
.radio-btn { display: flex; align-items: center; gap: 8px; cursor: pointer; background: var(--specter-dark-accent); border: 2px solid #2a3a4a; border-radius: var(--radius); padding: 10px 18px; transition: all 0.2s; font-size: 0.88rem; color: var(--specter-light-secondary); font-weight: 600; user-select: none; }
.radio-btn input { display: none; }
.radio-btn.selected, .radio-btn:hover { border-color: var(--specter-primary); color: var(--specter-primary); background: rgba(31,153,229,0.08); }
.conditional { display: none; }
.conditional.visible { display: block; }
.btn { padding: 11px 24px; border-radius: var(--radius); border: none; font-family: 'Roboto', system-ui, sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px; }
.btn-primary { background: var(--specter-primary); color: #fff; }
.btn-primary:hover { background: #1a87cc; }
.btn-pdf { background: linear-gradient(135deg, var(--specter-primary), #1570c0); color: #fff; font-size: 1.05rem; padding: 15px 40px; box-shadow: 0 4px 20px rgba(31,153,229,0.4); display: block; margin: 32px auto 0; }
.btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(31,153,229,0.5); }
.start-screen { text-align: center; padding: 48px 24px; }
.start-screen h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 16px; color: var(--specter-light); }
.start-screen p { font-size: 0.95rem; color: var(--specter-light-secondary); line-height: 1.7; max-width: 580px; margin: 0 auto 32px; }
.start-screen .btn-primary { font-size: 1rem; padding: 14px 36px; }
.device-block { background: var(--specter-dark-accent); border: 1px solid #2a3a4a; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.device-block-title { font-size: 0.78rem; font-weight: 700; color: var(--specter-primary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
/* ===== Passwort-Modal / Toast ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(2,5,9,0.72); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-box { background: var(--specter-dark-secondary); border: 1px solid #2a3a4a; border-radius: var(--radius); padding: 26px 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transform: translateY(30px) scale(0.97); opacity: 0; transition: transform 0.28s cubic-bezier(.22,.8,.35,1), opacity 0.22s; }
.modal-box.modal-visible { transform: translateY(0) scale(1); opacity: 1; }
/* ===== Lade-Modal (Drag & Drop) ===== */
.load-modal-box { max-width: 520px; }
.load-dropzone { border: 2px dashed #2a3a4a; border-radius: var(--radius); padding: 36px 24px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; margin-bottom: 16px; }
.load-dropzone:hover, .load-dropzone.dragover { border-color: var(--specter-primary); background: rgba(79,172,117,0.06); }
.load-dropzone svg { display: block; margin: 0 auto 12px; opacity: 0.55; }
.load-dropzone-label { font-size: 0.9rem; color: var(--specter-light-secondary); line-height: 1.5; }
.load-dropzone-label strong { color: var(--specter-light); }
.load-dropzone.has-file { border-color: var(--specter-primary); background: rgba(79,172,117,0.08); }
.load-dropzone.has-file .load-dropzone-label { color: var(--specter-primary); }
.load-pw-section { margin-bottom: 8px; }
/* Subtiler sekundärer Button-Stil */
.btn-subtle { background: rgba(255,255,255,0.04); color: var(--specter-light-secondary); border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem; padding: 9px 20px; }
.btn-subtle:hover { background: rgba(255,255,255,0.08); color: var(--specter-light); border-color: rgba(255,255,255,0.18); }
/* Speichern-Infobox */
.save-info-box { background: var(--specter-dark-accent); border: 1px solid #2a3a4a; border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; font-size: 0.8rem; color: var(--specter-light-secondary); line-height: 1.6; display: none; }
.save-info-box.visible { display: block; }
.modal-box h3 { font-size: 1.05rem; font-weight: 800; color: var(--specter-light); margin-bottom: 8px; }
.modal-box p { font-size: 0.82rem; color: var(--specter-light-secondary); line-height: 1.55; margin-bottom: 16px; }
.modal-box input[type="password"] { width: 100%; padding: 11px 13px; margin-bottom: 12px; background: var(--specter-dark-accent); border: 1px solid #2a3a4a; border-radius: var(--radius); color: var(--specter-light); font-family: inherit; font-size: 0.92rem; }
.modal-box input[type="password"]:focus { outline: none; border-color: var(--specter-primary); }
.modal-err { color: var(--specter-coral); font-size: 0.8rem; margin-bottom: 10px; min-height: 1em; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.btn-ghost { background: transparent; color: var(--specter-light-secondary); border: 1px solid #2a3a4a; }
.btn-ghost:hover { color: var(--specter-light); border-color: #3a4a5a; }
.toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(12px); background: var(--specter-dark-secondary); border: 1px solid var(--specter-primary); color: var(--specter-light); padding: 13px 22px; border-radius: var(--radius); font-size: 0.9rem; font-weight: 700; box-shadow: 0 6px 24px rgba(0,0,0,0.45); z-index: 210; opacity: 0; transition: opacity 0.25s, transform 0.25s; }
.toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.toast-ok { border-color: var(--specter-primary); }
.toast.toast-err { border-color: var(--specter-coral); color: #FFB3B3; }
/* ===== PDF ===== */
#pdf-document { display: none; }
@media print {
  #app-ui { display: none !important; }
  #offline-status-badge, .github-footer { display: none !important; }
  .toast { display: none !important; }
  #pdf-document { display: block !important; }
  @page { size: A4; margin: 0; }
  body { background: #fff; }
}

      style:style, preferredMode:MODES[preferredModeIndex], actualMode:MODES[actualModeIndex],
      fallback:fallback, luminanceIndex:mixed&0x3, swapped:popcount(input)%2===1,
      background:col.background, foreground:col.foreground

    if(connections==null || connections.length!==EDGE_COUNT) throw new RangeError("connections must contain 58 entries");

    for(var index=0;index<EDGE_COUNT;index+=1){
      if(connections[index]!==0 && connections[index]!==1) throw new RangeError("connections must contain only zeroes and ones");

  }

  function connectedRectangleEdgeMask(top,left,bottom,right,requiredEdges){
    var result=0n;
    for(var row=top; row<=bottom; row+=1){

    var result=0n;

    if(edgeCount!==bestEdgeCount) return edgeCount>bestEdgeCount;

    var bestArea=(best.bottomRow-best.topRow+1)*(best.rightColumn-best.leftColumn+1);
    if(area!==bestArea) return area<bestArea;
    if(candidate.topRow!==best.topRow) return candidate.topRow<best.topRow;
    if(candidate.leftColumn!==best.leftColumn) return candidate.leftColumn<best.leftColumn;
    if(candidate.bottomRow!==best.bottomRow) return candidate.bottomRow<best.bottomRow;

    var remaining=requiredEdges & ~coveredEdges;

    while(coveredEdges!==requiredEdges || coveredJunctions!==requiredJunctions){
      var anchorEdge=firstUncoveredEdge(requiredEdges,coveredEdges);
      var anchorJunction=anchorEdge<0 ? firstUncoveredJunction(requiredJunctions,coveredJunctions) : -1;

      if(anchorEdge>=0){
        var edge=EDGES[anchorEdge];

              var newEdges=edges & ~coveredEdges;

  // Liefert '' bei ungueltiger/leerer Eingabe.

        +'<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="20" ry="20" fill="'+visual.background+'"/>';

      for(var i=0;i<blobs.length;i+=1){
        var b=blobs[i];
        var bx=10+b.leftColumn*30, by=10+b.topRow*30, bw=20+(b.rightColumn-b.leftColumn)*30, bh=20+(b.bottomRow-b.topRow)*30;
        svg+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="10" ry="10" fill="'+visual.foreground+'"/>';

    warnTitle:'Do NOT enter secrets here!',
    warnBody:'Seed phrases, PINs and passphrases are <strong>never</strong> typed in &#8211; you fill those in by hand in the PDF later. You may only type labels (seed/wallet/account names) and tamper-evident bag numbers, as these are not secrets.',

    secTipsLabel:'&#128737; Bitcoin Security Tips',
    secTipsEmpty:'&#10003;&nbsp; Great! No further security recommendations based on your current setup.',

    secTipsAdvanced:'Advanced Security', secTipsAdvBadge:'Advanced',
    secTitle1:'Step 1: Use tear-resistant, waterproof paper',
    secBody1:'At least one backup is on regular paper. Regular paper is susceptible to water and moisture. As an easy next step, we recommend tear-resistant, waterproof paper (e.g. TerraPhrase in the Backup Stack). It survives water damage and lasts much longer.',
    secTitle2:'Step 2: Steel backup for fire and water protection',
    secBody2:'Paper burns. For truly secure, generational storage, a steel backup is essential. Steel survives fire (up to 1400 °C) and flooding and remains readable for decades. Recommendations: Seedor or Titan Wallet.',
    secTitle3:'Use Tamper-Evident Bags',
    secBody3:'At least one plaintext backup (paper, metal or SD card) is recorded without a tamper-evident bag. These tamper-evident security bags show immediately if someone has had unauthorized access – indispensable for safe storage. The bag number serves as proof of integrity.',
    secTitle4:'Add a passphrase as a second security factor',
    secBody4:'At least one seed phrase has no passphrase. A passphrase is an additional secret word (or phrase) that generates a completely new wallet. Anyone who finds only the seed phrase cannot access the Bitcoin without the passphrase. It also enables “plausible deniability”: a small amount of Bitcoin in the wallet without a passphrase deceives an attacker, while the actual funds are safely hidden behind it. Recommended: at least 12 characters, upper and lower case, numbers and special characters, no spaces.',
    secTitle4b:'Consider a multisig for extra robustness',
    secBody4b:'You already protect at least one seed phrase with a passphrase. A multisig wallet can make your setup even more robust: instead of relying on a single hardware wallet, you spread trust across multiple keys – and you no longer need to combine a seed phrase and its passphrase to sign a single transaction.',
    secTitle4c:'Consider a passphrase or a multisig wallet',
    secBody4c:'None of your seed phrases currently has a passphrase, and you don&rsquo;t use a multisig wallet either. Both are ways to add an extra layer of protection beyond a single seed phrase – a passphrase creates a hidden second wallet, while a multisig spreads trust across multiple keys/devices. Either is a reasonable next step, depending on your setup.',
    secTitle5:'Specter DIY: Add Secure Element via Upgrade Kit',
    secBody5:'You are using a Specter DIY Snapcase. Without a Shield, the device stores the seed phrase in internal flash memory – without hardware-level PIN protection. With the Upgrade Kit you add a Secure Element via smartcard: the seed phrase is then stored PIN-protected on the card and is significantly more secure against physical access.',
    secTitle6:'Enter a longer passphrase more easily with Specter',
    secBody6fn:function(brands){ return 'You are using '+brands+' with a passphrase. These devices have no physical keyboard – entering a long passphrase character by character via touchscreen or a few buttons is tedious. With a Specter (physical keyboard) you can conveniently type a much longer and thus more secure passphrase. Recommended: 12+ characters, upper/lower case, numbers, special characters, no spaces.'; },
    secTitle7:'Multisig: include different manufacturers (multi-vendor)',
    secBody7fn:function(name,brand,alts){ return name+' uses exclusively '+brand+' devices. In a single-vendor multisig, manufacturer-specific vulnerabilities or firmware bugs can compromise all keys simultaneously. Recommendation: include at least one device from another manufacturer, e.g. '+alts+'.'; },
    secTitle8fn:function(n){ return 'Set up multisig – you already have '+n+' devices'; },
    secBody8fn:function(n){ return 'With '+n+' hardware wallets you have everything you need for a multisig wallet (e.g. 2-of-'+n+'). In a multisig, a single compromised device is not enough to steal Bitcoin – you need multiple keys simultaneously. Tools like Sparrow Wallet or Specter Desktop make the setup possible in just a few steps.'; },
    secTitle10:'Trezor without Secure Element: vulnerable to physical attack',
    secBody10fn:function(models){ return models+' has no Secure Element. With physical access to the device, a targeted attack (e.g. voltage glitching or memory dump) can read the seed phrase – even if the device is secured with a PIN. The PIN alone does not protect against a determined attacker with the device in hand. Recommendation: use a device with a Secure Element. The seed phrase is stored encrypted in the chip and cannot be read via memory dump.'; },
    secTitle11:'Upgrade to Specter Shield Lite: replaceable Secure Element',
    secBody11fn:function(brands){ return 'You are using '+brands+'. The Specter Shield Lite offers an important extra: the Secure Element is on a replaceable smartcard. You can store the card separately, replace it when needed, or create multiple cards (e.g. one per location) – without replacing the device. The Shield Lite also enables encrypted seed phrase backups directly on the chip, eliminating the need for an unencrypted paper backup.'; },
    secTitle12:'SD card: replace unencrypted backup with Secure Element backup',
    secBody12:'At least one backup is on an SD card. SD card backups are usually stored unencrypted – anyone who finds the card has direct access to the seed phrase. With a Specter Shield Lite or Specter Shield, the seed phrase can be stored encrypted on the Secure Element (smartcard) instead. The backup is then PIN-protected and cannot be read even with physical access to the card.',
    ctaTitle:'Get personalised professional advice',
    ctaBody:'Book a free 15-minute call in which we analyse your Bitcoin security setup and discuss how you can strategically improve both your inheritance plan and overall Bitcoin security.',
    ctaBtn:'Book Free Initial Consulting',

    pdfSellTitle:'Verkaufen der Bitcoin',
    pdfSellText:'Um Bitcoin in herkömmliches Geld umzuwandeln, verwendet am besten eine der oben genannten Börsen, bei der ich bereits ein Konto habe, oder übertragt die Coins direkt an eine andere Person. Prüft jede Zieladresse doppelt, Transaktionen sind unwiderruflich. <strong>Die Seed-Phrase der Hardware-Wallet darf dabei auf keinen Fall in ein Handy oder ein anderes internetfähiges Gerät eingegeben werden.</strong> Es wird klar empfohlen, für die Transaktion die vorhandene(n) Hardware-Wallet(s) zu verwenden und damit zu signieren. Nur wer wirklich genau weiß, was er oder sie tut, sollte davon abweichen.',
    pdfSellNoKycWarning:'Wichtig: Bitcoin, die als No-KYC markiert sind (siehe Glossar), dürfen nicht einfach auf einer Börse verkauft werden. Da diese Coins anonym sind und nie auf meinen Namen registriert wurden, sollte der Verkauf zunächst strategisch überlegt werden. Am besten die Nutzung von No-KYC-Bitcoin zunächst noch einmal überdenken oder sie stattdessen peer-to-peer direkt an eine Privatperson verkaufen, statt über eine Börse.',
    pdfSellDisclaimer:'Hinweis: Dieses Dokument behandelt ausschliesslich die <strong>technische Wiederherstellung und den Zugriff</strong>. Es ist keine Steuer- oder Rechtsberatung. Klärt steuerliche und erbrechtliche Fragen mit einer Fachperson.',

    pdfTimelockDetail:'Timelock Recovery sichert eine Wallet mit Bitcoin (Quelle) ab. Verliere ich den Zugriff auf diese Wallet (z. B. Verlust, Brand, Tod), wird die voraus-signierte (presigned) Transaction ausgelöst – nach Ablauf des Timelocks (z. B. 90 Tage) landen die Bitcoin automatisch auf der neuen Wallet (Ziel / Secondary Wallet). Bis dahin kann der ursprüngliche Besitzer jederzeit eingreifen.',

    warnTitle:'Gib hier KEINE Geheimnisse ein!',
    warnBody:'Seed-Phrasen, PINs und Passphrasen werden <strong>niemals</strong> eingetippt &#8211; sie tr&#228;gst du sp&#228;ter handschriftlich ins PDF ein. Eintippen darfst du nur Bezeichnungen (Seed-/Wallet-/Account-Namen) und Tamper-Evident-Bag-Nummern, da diese keine Geheimnisse sind.',
    bagColNumber:'Tamper-Evident-Bag-Nummer', bagColDate:'Datum', bagColValid:'Aktuell g&uuml;ltig?',
    secTipsLabel:'&#128737; Tipps zur Bitcoin-Sicherheit',
    secTipsEmpty:'&#10003;&nbsp; Sehr gut! Keine weiteren Sicherheitsempfehlungen auf Basis deiner aktuellen Konfiguration.',
    secTipsBaseOk:'&#10003;&nbsp; Keine Basis-Empfehlungen &#8211; dein Setup sieht solide aus.',
    secTipsAdvanced:'Erweiterte Sicherheit', secTipsAdvBadge:'Erweitert',
    secTitle1:'Schritt 1: Rei&szlig;festes, wasserfestes Papier verwenden',
    secBody1:'Mindestens ein Backup ist auf normalem Papier. Normales Papier ist empfindlich gegen&uuml;ber Wasser und Feuchtigkeit. Als einfachen n&auml;chsten Schritt empfehlen wir rei&szlig;festes, wasserfestes Papier (z. B. TerraPhrase im Backup Stack). Es &uuml;bersteht Wassersch&auml;den und ist deutlich langlebiger.',
    secTitle2:'Schritt 2: Stahl-Backup f&uuml;r Feuer- und Wasserschutz',
    secBody2:'Papier verbrennt. F&uuml;r eine generationen&uuml;bergreifende, wirklich sichere Aufbewahrung ist ein Stahl-Backup unerl&auml;sslich. Stahl &uuml;bersteht Feuer (bis 1400 &deg;C) und &Uuml;berflutungen und bleibt Jahrzehnte lesbar. Empfehlungen: Seedor oder Titan Wallet.',
    secTitle3:'Tamper-Evident Bags verwenden',
    secBody3:'Mindestens ein Klartext-Backup (Papier, Metall oder SD-Karte) ist ohne Tamper-Evident-Bag erfasst. Diese manipulationssicheren Sicherheitst&uuml;ten zeigen sofort, ob jemand unbefugt Zugriff hatte &ndash; unverzichtbar f&uuml;r die sichere Aufbewahrung. Die Bag-Nummer dient als Nachweis der Unversehrtheit.',
    secTitle4:'Passphrase als zweiten Schutzfaktor hinzuf&uuml;gen',
    secBody4:'Mindestens eine Seed-Phrase hat keine Passphrase. Eine Passphrase ist ein zus&auml;tzliches geheimes Wort (oder Satz), das ein komplett neues Wallet erzeugt. Wer nur die Seed-Phrase findet, kommt ohne die Passphrase nicht an die Bitcoin. Au&szlig;erdem erm&ouml;glicht sie &bdquo;Plausible Deniability&ldquo;: Eine kleine Menge Bitcoin auf dem Wallet ohne Passphrase t&auml;uscht einen Angreifer, w&auml;hrend die eigentlichen Mittel dahinter sicher sind. Empfohlen: mindestens 12 Zeichen, Gro&szlig;- und Kleinbuchstaben, Zahlen und Sonderzeichen, kein Leerzeichen.',
    secTitle4b:'Multisig für mehr Robustheit in Betracht ziehen',
    secBody4b:'Du sch&uuml;tzt bereits mindestens eine Seed-Phrase mit einer Passphrase. Mit einer Multisig-Wallet kannst du dein Setup noch robuster machen: Du verl&auml;sst dich dann nicht mehr auf eine einzige Hardware-Wallet, und musst Seed-Phrase und Passphrase nicht mehr zusammenf&uuml;hren, um eine Transaktion zu signieren.',
    secTitle4c:'Passphrase oder Multisig in Betracht ziehen',
    secBody4c:'Aktuell hat keine deiner Seed-Phrasen eine Passphrase, und du nutzt auch kein Multisig-Wallet. Beides sind Wege, eine zus&auml;tzliche Schutzebene &uuml;ber eine einzelne Seed-Phrase hinaus einzubauen &ndash; eine Passphrase erzeugt ein verstecktes zweites Wallet, ein Multisig verteilt das Vertrauen auf mehrere Schl&uuml;ssel/Ger&auml;te. Je nach deinem Setup ist beides ein sinnvoller n&auml;chster Schritt.',
    secTitle5:'Specter DIY: Secure Element per Upgrade Kit nachr&uuml;sten',
    secBody5:'Du verwendest einen Specter DIY Snapcase. Ohne Shield speichert das Ger&auml;t die Seed-Phrase im internen Flash-Speicher &ndash; ohne PIN-Schutz auf Hardware-Ebene. Mit dem Upgrade Kit r&uuml;stest du einen Secure Element per Smartcard nach: Die Seed-Phrase wird dann PIN-gesch&uuml;tzt auf der Karte gespeichert und ist deutlich sicherer gegen physischen Zugriff.',
    secTitle6:'L&auml;ngere Passphrase mit Specter einfacher eingeben',
    secBody6fn:function(brands){ return 'Du nutzt '+brands+' mit einer Passphrase. Diese Ger&auml;te haben keine physische Tastatur &ndash; eine lange Passphrase Zeichen f&uuml;r Zeichen per Touchscreen oder wenigen Tasten einzugeben ist m&uuml;hsam. Mit einem Specter (physische Tastatur) kannst du eine deutlich l&auml;ngere und damit sicherere Passphrase komfortabel eintippen. Je l&auml;nger die Passphrase, desto sicherer das Wallet. Empfohlen: 12+ Zeichen, Gro&szlig;-/Kleinbuchstaben, Zahlen, Sonderzeichen, ohne Leerzeichen.'; },
    secTitle7:'Multisig: verschiedene Hersteller einbinden (Multi-Vendor)',
    secBody7fn:function(name,brand,alts){ return name+' verwendet ausschlie&szlig;lich '+brand+'-Ger&auml;te. Bei einem Single-Vendor-Multisig k&ouml;nnen herstellerspezifische Sicherheitsl&uuml;cken oder Firmware-Bugs alle Schl&uuml;ssel gleichzeitig gef&auml;hrden. Empfehlung: mindestens ein Ger&auml;t eines anderen Herstellers einbinden, z. B. '+alts+'.'; },
    secTitle8fn:function(n){ return 'Multisig einrichten &ndash; du hast bereits '+n+' Ger&auml;te'; },

function L(key){
  var d=STRINGS[LANG]||STRINGS.en;
  var v=d[key];
  if(v===undefined) v=STRINGS.en[key];
  return (typeof v!=='function'&&v!=null)?v:key;
}
function Lf(key){
  var d=STRINGS[LANG]||STRINGS.en;
  var v=d[key];
  if(v===undefined) v=STRINGS.en[key];
  var args=Array.prototype.slice.call(arguments,1);
  return typeof v==='function'?v.apply(null,args):(v||key);
}
function tr(de,en){ return LANG==='de'?de:en; }
function toggleLang(){
  LANG=LANG==='de'?'en':'de';
  document.documentElement.lang=LANG;
  try{ var u=new URL(window.location.href); u.searchParams.set('lang',LANG); history.pushState(null,'',u.toString()); }catch(e){}
  updateHeaderLang();
  render();
}
function toggleLangDropdown(){
  var sw=document.getElementById('lang-switch');
  if(sw) sw.classList.toggle('is-open');
}
function setLang(lang){
  var sw=document.getElementById('lang-switch');
  if(sw) sw.classList.remove('is-open');
  if(LANG!==lang) toggleLang();
}
function updateHeaderLang(){
  var lt=document.getElementById('lang-text');
  if(lt) lt.textContent=LANG==='de'?'DE':'EN';
  var hdr=document.getElementById('header-title-text');
  if(hdr) hdr.textContent=L('headerTitle');
  var book=document.getElementById('btn-book');
  if(book) book.textContent=L('bookBtn');
  var home=document.getElementById('btn-home');
  if(home){ home.textContent=L('homeBtn'); home.href=LANG==='de'?'/de/':'/'; }
  var ll=document.getElementById('logo-link');
  if(ll) ll.href=LANG==='de'?'/de/':'/';
  var gf=document.getElementById('github-footer-link');
  if(gf) gf.textContent=L('githubLink');
  document.title=L('pageTitle');
  var rh=document.getElementById('pdf-rh-title');
  if(rh) rh.textContent=L('pdfRhTitle');
  var wt=document.getElementById('warn-title');
  if(wt) wt.textContent=L('warnTitle');
  var wb=document.getElementById('warn-body');
  if(wb) wb.innerHTML=' '+L('warnBody');
  refreshOfflineHeaderStatus();
}

// Umrechnung Timelock-Eingabe (Tage/Monate/Jahre/Bloecke) -> Bloecke, gedeckelt am Bitcoin-Maximum.
function lwTimelockBlocks(rec){
  var b;
  if(rec.timelockUnit==="blocks") b=parseInt(rec.timelockValue)||1;
  else {
    var days = rec.timelockUnit==="years" ? (parseFloat(rec.timelockValue)||0)*DAYS_PER_YEAR
             : rec.timelockUnit==="days"  ? (parseFloat(rec.timelockValue)||0)
             : (parseFloat(rec.timelockValue)||0)*DAYS_PER_MONTH; // default "months"
    b=Math.round(days*BLOCKS_PER_DAY);
  }
  return Math.min(LIANA_MAX_TIMELOCK_BLOCKS, Math.max(1, b));
}
function lwTimelockLabel(rec){
  var b=lwTimelockBlocks(rec);
  var atMax = b>=LIANA_MAX_TIMELOCK_BLOCKS;
  if(rec.timelockUnit==="blocks") return b+" "+tr("Blöcke","blocks")+(atMax?tr(" (Maximum)"," (maximum)"):"");
  var unit={days:tr("Tag(e)","day(s)"), months:tr("Monat(e)","month(s)"), years:tr("Jahr(e)","year(s)")}[rec.timelockUnit]||"";
  return "~"+rec.timelockValue+" "+unit+" (~"+b+" "+tr("Blöcke","blocks")+(atMax?tr(", Maximum",", maximum"):"")+")";
}

function ensureArrayLen(arr, len, fill) {
 if (!Array.isArray(arr)) arr = [];
 while (arr.length < len) arr.push(fill);
 if (arr.length > len) arr.length = len;
 return arr;
}
function isValidFingerprint(v){ return /^[0-9A-Fa-f]{8}$/.test((v || '').trim()); }

 state.sw[kind + 'B85'] = ensureArrayLen(state.sw[kind + 'B85'], len, false);
 state.sw[kind + 'Seed'] = ensureArrayLen(state.sw[kind + 'Seed'], len, '');
 state.sw[kind + 'Idx'] = ensureArrayLen(state.sw[kind + 'Idx'], len, '');
 state.sw[kind + 'Words'] = ensureArrayLen(state.sw[kind + 'Words'], len, 12);
 state.sw[kind + 'Mode'] = ensureArrayLen(state.sw[kind + 'Mode'], len, '');

// Seed-Phrase- / Passphrase- / Account-Strukturen – fuer das presigned-Transaction-Dropdown (Timelock Recovery / RITREK).
function seedStructures(){
  var out=[];
  for(var si=0;si<state.seeds.length;si++){
    var sd=state.seeds[si]; var ws=[{w:sd.wallet,t:" (ohne Passphrase)"}];
    for(var pp=0;pp<sd.passphrases;pp++){ ws.push({w:sd.pp[pp],t:" + Passphrase "+(pp+1)}); }
    for(var w=0;w<ws.length;w++){
      var ww=ws[w].w; if(!ww) continue;
      var fmts=(ww.fmts&&ww.fmts.length)?ww.fmts:[defFmt()];
      for(var f=0;f<fmts.length;f++){ var cnt=(ww.acc&&ww.acc[fmts[f]])||1; for(var ac=0;ac<cnt;ac++){ out.push(seedName(si)+ws[w].t+" – Account #"+ac+" ("+ADDR_TYPES[fmts[f]]+")"); } }
    }
  }
  return out;
}

function cacheRequest(cache, url){
  return cache.match(url).then(function(hit){
    if(hit) return;
    return fetch(url, {cache:'no-store'}).then(function(res){
      if(!res || (!res.ok && res.type!=='opaque')) return;
      return cache.put(url, res.clone());
    });
  }).catch(function(){});
}
function primeOfflineCache(){
  if(!('caches' in window)) return Promise.resolve();
  return caches.open(OFFLINE_CACHE_NAME).then(function(cache){
    var urls = collectOfflineAssetUrls();
    urls.push(OFFLINE_FONT_CSS_URL);
    var jobs = urls.map(function(url){ return cacheRequest(cache, url); });
    return Promise.all(jobs).then(function(){
      return fetch(OFFLINE_FONT_CSS_URL, {cache:'no-store'}).then(function(cssRes){
        if(!cssRes || !cssRes.ok) return;
        var clone = cssRes.clone();
        return cssRes.text().then(function(cssText){
          return cache.put(OFFLINE_FONT_CSS_URL, clone).then(function(){
            var fontUrls = [];
            var re = /url\((['"]?)([^)'"]+)\1\)/g;
            var m;
            while((m = re.exec(cssText))){ fontUrls.push(new URL(m[2], new URL(OFFLINE_FONT_CSS_URL, window.location.href)).href); }
            return Promise.all(fontUrls.map(function(url){ return cacheRequest(cache, url); }));
          });
        });
      }).catch(function(){});
    });
  });
}
function cacheHasAllOfflineAssets(){
  if(!('caches' in window)) return Promise.resolve(false);
  var urls = collectOfflineAssetUrls();
  urls.push(OFFLINE_FONT_CSS_URL);
  return caches.open(OFFLINE_CACHE_NAME).then(function(cache){
    return Promise.all(urls.map(function(url){
      return cache.match(url).then(function(match){ return !!match; }).catch(function(){ return false; });
    })).then(function(matches){
      return matches.length > 0 && matches.every(function(hit){ return !!hit; });
    });
  }).catch(function(){ return false; });
}
function refreshOfflineHeaderStatus(){
  var badge=document.getElementById('offline-status-badge');
  var text=document.getElementById('offline-status-text');
  var check=document.getElementById('offline-status-check');
  if(!badge || !text || !check) return Promise.resolve(false);
  var setAvailable=function(){
    badge.classList.remove('is-ready');
    badge.classList.remove('is-checking');
    text.textContent=L('offlineHeaderAvailable');
    check.hidden = true;
    badge.title=L('offlineHeaderNotCachedYet');
    return false;
  };
  if(!('navigator' in window) || !('serviceWorker' in navigator) || !('caches' in window)){
    return Promise.resolve(setAvailable());
  }
  badge.classList.add('is-checking');
  badge.classList.remove('is-ready');
  text.textContent=L('offlineHeaderAvailable');
  check.hidden = true;
  badge.title=L('offlinePreloadStart');
  return Promise.all([
    cacheHasAllOfflineAssets(),
    navigator.serviceWorker.ready.then(function(reg){ return !!reg; }).catch(function(){ return false; })
  ]).then(function(results){
    var cacheReady=!!results[0];
    var swReady=!!results[1];
    var verifiedOffline = !navigator.onLine && cacheReady && swReady;
    badge.classList.remove('is-checking');
    if(verifiedOffline){
      badge.classList.add('is-ready');
      text.textContent=L('offlineHeaderReadyNow');
      check.hidden = false;
      badge.title=L('offlineHeaderReadyNow');
      return true;
    }
    badge.classList.remove('is-ready');
    text.textContent=L('offlineHeaderAvailable');
    check.hidden = true;
    badge.title = (cacheReady && swReady) ? L('offlineHeaderCachedOnline') : L('offlineHeaderNotCachedYet');
    return false;
  }).catch(function(){ return setAvailable(); });
}

function waitForPdfImages(root){
  var imgs = root.querySelectorAll('img');
  var pending = [];
  for(var i=0;i<imgs.length;i++){
    (function(img){
      pending.push(new Promise(function(resolve){
        var done = false;
        function finish(){ if(done) return; done = true; resolve(); }
        // img.complete/naturalWidth only means the bytes arrived, not that the browser
        // has finished decoding the bitmap - printing right after that race could still
        // paginate around a not-yet-painted image. decode() waits for the real thing;
        // fall back to the load/error events on older browsers without it.
        if(img.complete && img.naturalWidth>0){
          if(img.decode){ img.decode().then(finish).catch(finish); } else { finish(); }
          setTimeout(finish, 3000);
          return;
        }
        img.addEventListener('load', function(){ if(img.decode){ img.decode().then(finish).catch(finish); } else { finish(); } }, {once:true});
        img.addEventListener('error', finish, {once:true});
        setTimeout(finish, 3000);
      }));
    })(imgs[i]);
  }
  return Promise.all(pending);
}

function showChapterTooltip(button){
  var tooltip=document.getElementById("progress-tooltip");
  if(!tooltip || !button) return;
  emphasizeChapter(button);
  tooltip.innerHTML='<span class="progress-tooltip__chapter">'+esc(button.getAttribute("data-chapter"))+'</span>'
    +'<span class="progress-tooltip__title">'+esc(button.getAttribute("data-title"))+'</span>'
    +'<span class="progress-tooltip__description">'+esc(button.getAttribute("data-description"))+'</span>';
  tooltip.hidden=false;
  tooltip.style.visibility="hidden";
  var marker=button.getBoundingClientRect();
  var center=marker.left+marker.width/2;
  tooltip.style.left=center+"px";
  tooltip.style.top=(marker.top-10)+"px";
  var bubble=tooltip.getBoundingClientRect();
  var above=marker.top>=bubble.height+18;
  tooltip.classList.toggle("progress-tooltip--below",!above);
  tooltip.style.transform=above?"translate(-50%, -100%)":"translate(-50%, 0)";
  tooltip.style.top=above?(marker.top-10)+"px":(marker.bottom+10)+"px";
  var clampedCenter=Math.max(12+bubble.width/2,Math.min(window.innerWidth-12-bubble.width/2,center));
  tooltip.style.left=clampedCenter+"px";
  tooltip.style.setProperty("--progress-tooltip-arrow",(center-(clampedCenter-bubble.width/2))+"px");
  tooltip.style.visibility="visible";
}
function hideChapterTooltip(force){
  if(!force){
    var active=document.activeElement;
    if(active && active.classList && active.classList.contains("progress-chapter")){ showChapterTooltip(active); return; }
    var hovered=document.querySelector(".progress-chapter:hover");
    if(hovered){ showChapterTooltip(hovered); return; }
  }
  clearChapterEmphasis();
  var tooltip=document.getElementById("progress-tooltip");
  if(tooltip) tooltip.hidden=true;
}

function renderWalletAcc(i,p){
  var w=walletOf(i,p); var avail=availIdx();
  var h='';
  h+='<div class="form-group"><label class="form-label" style="text-transform:none;font-size:0.72rem;">'+Lf('fpLabel',p)+'</label>'
    +'<div style="display:flex;align-items:center;gap:8px;">'

    h+='<div class="mini-note" style="color:#f5b41e;">'+L('fpWarnInvalid')+'</div>';
  }
  // Derivation path / xPub are watch-only data (see offline hint) - like the fingerprint above,

    h+='<div class="form-group"><label class="form-label" style="text-transform:none;font-size:0.72rem;">'+L('derivPathLabel')+'</label>'
      +'<input class="form-control" type="text" value="'+esc(w.derivPath||"")+'" placeholder="'+L('derivPathPh')+'" oninput="setWDerivPath('+i+','+p+',this.value)"></div>';

    h+='<div class="chip-group">';
    for(var k=0;k<avail.length;k++){ var f=avail[k]; var on=w.fmts.indexOf(f)>=0; h+='<span class="chip '+(on?"selected":"")+'" onclick="toggleWFmt('+i+','+p+','+f+')">'+esc(ADDR_TYPES[f])+'</span>'; }
    h+='</div>';
  }
  for(var k2=0;k2<avail.length;k2++){
    var fmt=avail[k2]; if(w.fmts.indexOf(fmt)<0) continue;
    var cnt=w.acc[fmt]||1;
    h+='<div style="border-top:1px solid #2a3a4a;margin-top:10px;padding-top:8px;">';
    if(avail.length>=2) h+='<div style="font-weight:700;color:var(--specter-primary);font-size:0.82rem;margin-bottom:6px;">'+esc(ADDR_TYPES[fmt])+'</div>';
    h+='<label class="form-label">'+L('accCount')+'</label>';

    h+='</div>';
  }
  return h;

// ===== Liana Wallet: Wallet-Descriptor-Backup-Tracking =====
// Analog zu Multisig, aber ueber Primaer- UND alle Recovery-Pfade hinweg, da ein Liana-Wallet
// EINEN gemeinsamen Descriptor fuer den gesamten Miniscript-Policy-Baum hat (nicht pro Pfad).
// Zusaetzlich zu den Multisig-Feldern: dbLianaApp - Liana speichert den Descriptor selbst lokal.
function ensureLwDb(lw){
  if(!lw.dbDevices)lw.dbDevices=[];
  if(!lw.dbBackups)lw.dbBackups=[];
  if(lw.dbPwm==null)lw.dbPwm=false;
  if(lw.dbBook==null)lw.dbBook=false;
  if(lw.dbLianaApp==null)lw.dbLianaApp=false;
  if(lw.dbExp==null)lw.dbExp=false;
  if(lw.descriptorInPasswordManager==null)lw.descriptorInPasswordManager=false;
  if(!lw.descriptorLoadedOnHardwareWallets)lw.descriptorLoadedOnHardwareWallets={};
  return lw;
}
function lwAllSeedIdxs(i){
  var lw=state.lianaWallets[i], out=[], seen={};
  var paths=[lw.primary].concat(lw.recoveries);
  for(var p=0;p<paths.length;p++){ var seeds=paths[p].seeds; for(var k=0;k<seeds.length;k++){ if(!seen[seeds[k]]){ seen[seeds[k]]=1; out.push(seeds[k]); } } }
  return out;
}
// Ist eine Seed-Phrase (Index si) Teil irgendeines Liana-Wallets (Primaer- oder Recovery-Pfad)?
function seedInAnyLiana(si){
  for(var i=0;i<state.lianaWallets.length;i++){ if(lwAllSeedIdxs(i).indexOf(si)>=0) return true; }
  return false;
}
function lwAllCosigners(i){
  var lw=state.lianaWallets[i]; var out=[].concat(lw.primary.cosigners);
  for(var r=0;r<lw.recoveries.length;r++){ out=out.concat(lw.recoveries[r].cosigners); }
  return out;
}
function lwDeviceIdxs(i){
  var seeds=lwAllSeedIdxs(i), out=[], seen={};
  for(var k=0;k<seeds.length;k++){ var s=state.seeds[seeds[k]]; if(!s) continue;
    for(var d=0;d<(s.devices||[]).length;d++){ var di=s.devices[d]; if(state.devices[di] && !seen[di]){ seen[di]=1; out.push(di); } } }
  return out;
}
function lwBackupRefs(i){
  var seeds=lwAllSeedIdxs(i), out=[];
  for(var k=0;k<seeds.length;k++){ var si=seeds[k], s=state.seeds[si]; if(!s) continue;
    for(var b=0;b<(s.backups||[]).length;b++){ out.push({si:si,bi:b,key:si+":"+b,label:(s.name||"Seed "+(si+1))+" – Backup "+(b+1)}); } }
  return out;
}
function lwSeedFullyBacked(i, si){
  var lw=state.lianaWallets[i]; ensureLwDb(lw); var s=state.seeds[si];
  if(!s || (s.backups||[]).length===0) return false;
  for(var b=0;b<s.backups.length;b++){
    if(lw.dbBackups.indexOf(si+":"+b)>=0) continue;
    if(s.backups[b] && s.backups[b].descriptorWithBackup) continue;
    return false;
  }
  return true;
}
function lwAnyDescriptor(i){ var lw=state.lianaWallets[i]; ensureLwDb(lw); return lw.dbDevices.length>0 || lw.dbBackups.length>0 || lw.dbPwm || lw.dbBook || lw.dbLianaApp; }
function lwDescStatus(i){
  var lw=state.lianaWallets[i]; ensureLwDb(lw);
  var m=lw.primary.m||1;
  var allSeeds=lwAllSeedIdxs(i);
  var completeSeeds=[], incompleteSeeds=[];
  for(var k=0;k<allSeeds.length;k++){
    var si=allSeeds[k];
    if(lwSeedFullyBacked(i,si)){ completeSeeds.push(si); } else { incompleteSeeds.push(si); }
  }
  var completePrimary=0;
  for(var k2=0;k2<lw.primary.seeds.length;k2++){ if(lwSeedFullyBacked(i,lw.primary.seeds[k2])) completePrimary++; }

  if(lwAllCosigners(i).length>0){
    if(incompleteSeeds.length>0){
      var incompleteLabels=[]; for(var k3=0;k3<incompleteSeeds.length;k3++){ incompleteLabels.push(seedName(incompleteSeeds[k3])); }
      return {level:"err", covered:completeSeeds.length, need:allSeeds.length,
        msg:'<strong>'+tr('Pflicht nicht erfüllt:','Requirement not met:')+'</strong> '+tr('Diese Liana-Wallet hat eine externe Person mit eigener Hardware-Wallet.','This Liana wallet has an external person with their own hardware wallet.')+' '+
          '<strong>'+tr('Jedes einzelne Backup jeder eigenen Seed-Phrase (Primär- und Recovery-Pfade) muss den Wallet-Descriptor enthalten.','Every single backup of every own seed phrase (primary and recovery paths) must contain the wallet descriptor.')+'</strong> '+
          tr('Bei','For')+' '+incompleteLabels.join(', ')+' '+tr('fehlen Descriptor-Backups.','descriptor backups are missing.')};
    }
    return {level:"ok", covered:completeSeeds.length, need:allSeeds.length,
      msg:tr('Der Wallet-Descriptor ist ausreichend gesichert:','The wallet descriptor is sufficiently backed up:')+' <strong>'+completeSeeds.length+' '+tr('von','of')+' '+allSeeds.length+'</strong> '+tr('Seed-Phrasen vollständig abgedeckt.','seed phrases fully covered.')};
  }

  if(completePrimary < m){
    var none=!lwAnyDescriptor(i);
    return {level:"err", covered:completePrimary, need:m,
      msg:none
        ? tr('Für dieses Liana-Wallet ist <strong>kein Wallet-Descriptor-Backup</strong> erfasst. Bei Verlust des Descriptors ist die Wallet <strong>nicht wiederherstellbar</strong> – auch nicht mit allen Schlüsseln.','No <strong>wallet descriptor backup</strong> is recorded for this Liana wallet. If the descriptor is lost, the wallet <strong>cannot be recovered</strong> – not even with all keys.')
        : '<strong>'+tr('Pflicht nicht erfüllt:','Requirement not met:')+'</strong> '+tr('Erst','Only')+' <strong>'+completePrimary+' '+tr('von','of')+' '+m+'</strong> '+tr('nötigen Primärpfad-Seed-Phrasen sind vollständig mit Wallet-Descriptor gesichert.','required primary-path seed phrases are fully backed up with the wallet descriptor.')};
  }

  if(incompleteSeeds.length>0){
    var inLbl=[]; for(var k4=0;k4<incompleteSeeds.length;k4++) inLbl.push(seedName(incompleteSeeds[k4]));
    return {level:"warn", covered:completeSeeds.length, need:allSeeds.length,
      msg:tr('Die Mindestbedingung ist erfüllt (','The minimum requirement is met (')+completePrimary+' '+tr('von','of')+' '+m+' '+tr('Primärpfad-Seed-Phrasen vollständig gesichert), aber','primary-path seed phrases fully backed up), but')+' '+inLbl.join(', ')+' '+(inLbl.length>1?tr('haben','have'):tr('hat','has'))+' '+tr('unvollständige Descriptor-Backups. <strong>Empfehlung:</strong> trotzdem jedem Backup einen Wallet-Descriptor beilegen.','incomplete descriptor backups. <strong>Recommendation:</strong> still include a wallet descriptor with every backup.')};
  }

  return {level:"ok", covered:completeSeeds.length, need:allSeeds.length,
    msg:tr('Der Wallet-Descriptor ist ausreichend gesichert:','The wallet descriptor is sufficiently backed up:')+' <strong>'+completeSeeds.length+' '+tr('von','of')+' '+allSeeds.length+'</strong> '+tr('Seed-Phrasen vollständig abgedeckt','seed phrases fully covered')+(lw.dbPwm?tr(' + Kopie im Passwort-Manager',' + copy in the password manager'):'')+'.'};
}

function toggleLwDbDevice(i,di){ var a=ensureLwDb(state.lianaWallets[i]).dbDevices; var k=a.indexOf(di); if(k>=0)a.splice(k,1); else a.push(di); render(); }
function toggleLwDbBackup(i,key){ var a=ensureLwDb(state.lianaWallets[i]).dbBackups; var k=a.indexOf(key); if(k>=0)a.splice(k,1); else a.push(key); render(); }
function toggleLwDbPwm(i){ var lw=ensureLwDb(state.lianaWallets[i]); lw.dbPwm=!lw.dbPwm; render(); }
function toggleLwDbBook(i){ var lw=ensureLwDb(state.lianaWallets[i]); lw.dbBook=!lw.dbBook; render(); }
function toggleLwDbLianaApp(i){ var lw=ensureLwDb(state.lianaWallets[i]); lw.dbLianaApp=!lw.dbLianaApp; render(); }

function lwDescriptorBackupSection(i){
  var lw=state.lianaWallets[i]; ensureLwDb(lw);
  var h='<div class="sub-block"><label class="chk-row"><input type="checkbox" '+(lw.dbExp?"checked":"")+' onchange="toggleLwDbExp('+i+')"> <strong>'+tr('Wo ist der Wallet-Descriptor gesichert?','Where is the wallet descriptor stored?')+'</strong> '+tr('(empfohlen erfassen)','(recommended to record)')+'</label>';

  if(allSeeds.length===0){ h+='<p class="mini-note">'+tr('Ordne diesem Liana-Wallet zuerst oben Seed-Phrasen zu (Primär- oder Recovery-Pfad) – dann erscheinen hier zusätzlich die passenden Hardware-Wallets und Backups.','Assign seed phrases to this Liana wallet above first (primary or recovery path) – then the matching hardware wallets and backups appear here.')+'</p></div>'; return h; }

  var devs=lwDeviceIdxs(i);
  h+='<div style="margin-top:8px;"><label class="form-label">'+tr('Auf welchen Hardware-Wallets ist der Wallet-Descriptor registriert / gebackupt?','On which hardware wallets is the wallet descriptor registered / backed up?')+'</label>';
  h+='<p class="mini-note">'+tr('Es werden nur Geräte angezeigt, die mit den Seed-Phrasen dieses Liana-Wallets verknüpft sind.','Only devices linked to the seed phrases of this Liana wallet are shown.')+'</p>';
  if(devs.length===0){ h+='<p class="mini-note">'+tr('Keine Hardware-Wallets mit den Seeds dieses Liana-Wallets verknüpft.','No hardware wallets are linked to the seeds of this Liana wallet.')+'</p>'; }
  for(var d=0;d<devs.length;d++){ var di=devs[d]; var on=lw.dbDevices.indexOf(di)>=0; h+='<label class="chk-row"><input type="checkbox" '+(on?"checked":"")+' onchange="toggleLwDbDevice('+i+','+di+')"> '+deviceLabel(di)+'</label>'; }
  h+='</div>';

  var bks=lwBackupRefs(i);
  h+='<div style="margin-top:10px;"><label class="form-label">'+tr('Bei welchen Seed-Phrase-Backups liegt ein Wallet-Descriptor-Backup bei?','Which seed phrase backups include a wallet descriptor backup?')+'</label>';
  if(bks.length===0){ h+='<p class="mini-note">'+tr('Keine Seed-Backups erfasst.','No seed backups recorded.')+'</p>'; }
  for(var b=0;b<bks.length;b++){ var bk=bks[b]; var onb=lw.dbBackups.indexOf(bk.key)>=0; h+='<label class="chk-row"><input type="checkbox" '+(onb?"checked":"")+' onchange="toggleLwDbBackup('+i+',\''+bk.key+'\')"> '+bk.label+'</label>'; }
  h+='</div>';

  h+='<div style="margin-top:10px;"><label class="form-label">'+tr('Weitere Aufbewahrungsorte des Wallet-Descriptors','Other storage locations for the wallet descriptor')+'</label>';
  h+='<label class="chk-row"><input type="checkbox" '+(lw.dbPwm?"checked":"")+' onchange="toggleLwDbPwm('+i+')"> '+tr('Im Passwort-Manager','In the password manager')+((state.pwm&&state.pwm.app)?(" ("+esc(pwmDisplayName())+")"):"")+'</label>';
  h+='<label class="chk-row"><input type="checkbox" '+(lw.dbBook?"checked":"")+' onchange="toggleLwDbBook('+i+')"> '+tr('Im Passwort-Heft / Notizbuch','In the password book / notebook')+'</label>';
  h+='<label class="chk-row"><input type="checkbox" '+(lw.descriptorInPasswordManager?"checked":"")+' onchange="toggleLwDescriptorInPwmDirect('+i+')"> '+tr('Wallet-Descriptor selbst im Passwort-Manager gespeichert','Wallet descriptor itself stored in the password manager')+'</label>';

  for(var dd=0;dd<state.devices.length;dd++){ allDevLabels.push({id:dd,label:deviceLabel(dd)}); }

    for(var h2=0;h2<allDevLabels.length;h2++){ h+='<label class="chk-row"><input type="checkbox" '+(lw.descriptorLoadedOnHardwareWallets[allDevLabels[h2].id]?"checked":"")+' onchange="toggleLwDescriptorOnHwDirect('+i+',\''+allDevLabels[h2].id+'\')"> '+allDevLabels[h2].label+'</label>'; }

function renderTimelock(){
  var h='<div class="section-card"><div class="section-card-body">';
  h+='<div class="wizard-question">'+L('timelockQ')+'</div>';
  h+='<div class="ritrek-head" style="margin-bottom:16px;">';

  h+='<p class="wizard-hint" style="margin:0;">'+L('timelockHint')+' <a href="'+esc(TIMELOCK_WEBSITE)+'" target="_blank" rel="noopener">'+esc(TIMELOCK_WEBSITE)+'</a></p>';

function buildIncompleteItems(){
  var items=[];
  function add(label,key,idx){ items.push({label:label, key:key, idx:(idx==null?null:idx)}); }

  for(var d=0; d<state.devices.length; d++){
    var dv=state.devices[d];
    if(!dv.model){ add(Lf('incDevNoModel',d+1), 'dev', d); }
    else if(dv.model==='Andere' && !dv.modelCustom){ add(Lf('incDevNoModelCustom',d+1), 'dev', d); }
    for(var c=0;c<(dv.companions||[]).length;c++){
      var cp=dv.companions[c];
      if(!cp.app){ add(Lf('incCompNoApp',d+1,c+1), 'dev', d); }
      else if(cp.app==='Andere' && !cp.appCustom){ add(Lf('incCompNoAppCustom',d+1,c+1), 'dev', d); }
    }
  }

  for(var s=0; s<state.seeds.length; s++){
    var sd=state.seeds[s]; var snm=esc(sd.name||('Seed-Phrase '+(s+1)));
    for(var b=0;b<sd.backups.length;b++){
      var bk=sd.backups[b];
      if(bk.type==='metal' && !bk.brand){ add(Lf('incMetalNoBrand',snm,b+1), 'seed', s); }
      else if(bk.type==='metal' && bk.brand==='Andere' && !bk.brandCustom){ add(Lf('incMetalNoBrandCustom',snm,b+1), 'seed', s); }
      if(bk.type==='smartcard' && !bk.smartcard){ add(Lf('incScNoCard',snm,b+1), 'seed', s); }
    }
  }

  for(var i=0;i<state.sw.pc;i++){
    if(!state.sw.pcModels[i]){ add(Lf('incSwNoApp',i+1), 'sw'); }
    else if(state.sw.pcModels[i]==='Andere' && !state.sw.pcModelsCustom[i]){ add(Lf('incSwNoAppCustom',i+1), 'sw'); }
  }
  for(var j=0;j<state.sw.phone;j++){
    if(!state.sw.phoneModels[j]){ add(Lf('incSwPhoneNoApp',j+1), 'sw'); }
    else if(state.sw.phoneModels[j]==='Andere' && !state.sw.phoneModelsCustom[j]){ add(Lf('incSwPhoneNoAppCustom',j+1), 'sw'); }
  }

  for(var e=0;e<state.ex.count;e++){
    if(!state.ex.names[e]){ add(Lf('incExNoName',e+1), 'ex'); }
    else if(state.ex.names[e]==='Andere' && !(state.ex.namesCustom||[])[e]){ add(Lf('incExNoNameCustom',e+1), 'ex'); }
  }

  if(state.pwm.use===true){
    if(!state.pwm.app){ add(L('incPwmNoApp'), 'pwm'); }
    else if(state.pwm.app==='Andere' && !state.pwm.appCustom){ add(L('incPwmNoAppCustom'), 'pwm'); }
  }

  for(var mi=0; mi<state.multisigs.length; mi++){
    var ms=state.multisigs[mi]; var msnm=esc(ms.name||('Multisig '+(mi+1)));
    var own=ms.seeds.length+ms.hot.length;
    if(own+ms.cosigners.length < ms.n){ add(Lf('incMsKeys',msnm,own+ms.cosigners.length,ms.n), 'multisig'); }
    for(var cci=0; cci<ms.cosigners.length; cci++){
      if(!ms.cosigners[cci].name){ add(Lf('incMsCosignerNoName',msnm,cci+1), 'multisig'); }
    }
  }

  if(state.timelock.use){
    if(!state.timelock.fromW){ add(L('incTimelockNoFrom'), 'timelock'); }
    if(!state.timelock.toW){ add(L('incTimelockNoTo'), 'timelock'); }
    else if(state.timelock.toW==='__custom__' && !state.timelock.toCustom){ add(L('incTimelockNoCustom'), 'timelock'); }
  }

  return items;
}

function buildRecommendations() {
  var tips = [];

  function anyBackupType(types) {
    if (typeof types === 'string') types = [types];
    for (var i = 0; i < state.seeds.length; i++) {
      var bks = state.seeds[i].backups || [];
      for (var b = 0; b < bks.length; b++) {
        if (types.indexOf(bks[b].type) >= 0) return true;
      }
    }
    return false;
  }

  function anyPlainNoBag() {
    for (var i = 0; i < state.seeds.length; i++) {
      var bks = state.seeds[i].backups || [];
      for (var b = 0; b < bks.length; b++) {
        if (backupIsPlain(bks[b].type) && !bks[b].bagDigital) return true;
      }
    }
    return false;
  }

  function anyPassphrase() {
    for (var i = 0; i < state.seeds.length; i++) {
      if ((state.seeds[i].passphrases || 0) > 0) return true;
    }
    return false;
  }

  function anyNoPassphrase() {
    for (var i = 0; i < state.seeds.length; i++) {
      if ((state.seeds[i].passphrases || 0) === 0) return true;
    }
    return false;
  }

  function hasMultisig() {
    return state.multisigs && state.multisigs.length > 0;
  }

  function isUsbHW(model) {
    var m = (model || '').toLowerCase();
    return m.indexOf('ledger') === 0 || m.indexOf('bitbox') === 0 || m.indexOf('trezor') === 0 || m.indexOf('keepkey') === 0;
  }

  function hwBrand(model) {
    var m = (model || '').toLowerCase();
    if (m.indexOf('ledger') === 0) return 'Ledger';
    if (m.indexOf('bitbox') === 0) return 'BitBox';
    if (m.indexOf('trezor') === 0) return 'Trezor';
    if (m.indexOf('specter') === 0) return 'Specter';
    if (m.indexOf('coldcard') === 0) return 'Coldcard';
    if (m.indexOf('passport') === 0) return 'Passport';
    if (m.indexOf('jade') >= 0) return 'Jade';
    if (m.indexOf('seedsigner') === 0) return 'SeedSigner';
    if (m.indexOf('krux') === 0) return 'Krux';
    if (m.indexOf('keepkey') === 0) return 'Keepkey';
    return 'Andere';
  }

  var loc = LANG==='de'?'de':'en';
  function shopUrl(slug){ return 'https://clavastack.com/'+loc+'/'+slug; }

  if (anyBackupType('paper') && !anyBackupType(['paper_rip', 'metal'])) {
    tips.push({ title:L('secTitle1'), body:L('secBody1'), links:[
      {text:'Backup Stack', url:shopUrl('products/backup-stack')}
    ]});
  }

  if (anyBackupType(['paper', 'paper_rip']) && !anyBackupType('metal')) {
    tips.push({ title:L('secTitle2'), body:L('secBody2'), links:[
      {text:'Seedor Starter Set', url:shopUrl('products/seedor-starter-set')},
      {text:'Titan Wallet Starter Kit', url:shopUrl('products/titan-wallet-starter-kit')}
    ]});
  }

  if (anyPlainNoBag()) {
    tips.push({ title:L('secTitle3'), body:L('secBody3'), links:[
      {text:'DEBASAFE Tamper-Evident Bags', url:shopUrl('products/debasafetueten')},
      {text:'Backup Stack', url:shopUrl('products/backup-stack')}
    ]});
  }

  if (state.seeds.length > 0 && anyNoPassphrase()) {
    tips.push({ title:L('secTitle4'), body:L('secBody4'), links:[] });
  }

  if (state.seeds.length > 0 && !hasMultisig()) {
    if (anyPassphrase()) {
      tips.push({ title:L('secTitle4b'), body:L('secBody4b'), links:[] });
    } else {
      tips.push({ title:L('secTitle4c'), body:L('secBody4c'), links:[] });
    }
  }

  var hasSpecterDIY = false;
  for (var i = 0; i < state.devices.length; i++) {
    if ((state.devices[i].model || '') === 'Specter DIY Snapcase') { hasSpecterDIY = true; break; }
  }
  if (hasSpecterDIY) {
    tips.push({ title:L('secTitle5'), body:L('secBody5'), links:[
      {text:'Specter Shield Lite Upgrade Kit', url:shopUrl('products/specter-shield-lite-upgrade-kit')},
      {text:'Specter Shield Lite', url:shopUrl('products/specter-shield-lite')},
      {text:'Specter Shield', url:shopUrl('products/specter-shield')}
    ]});
  }

  var usbBrands = [];
  for (var i = 0; i < state.devices.length; i++) {
    var m = state.devices[i].model || '';
    if (isUsbHW(m)) { var br = hwBrand(m); if (usbBrands.indexOf(br) < 0) usbBrands.push(br); }
  }
  if (usbBrands.length > 0 && anyPassphrase()) {
    tips.push({ title:L('secTitle6'), body:Lf('secBody6fn',esc(usbBrands.join(' / '))), links:[
      {text:'Specter Shield Lite', url:shopUrl('products/specter-shield-lite')},
      {text:'Specter Shield', url:shopUrl('products/specter-shield')}
    ]});
  }

  if (hasMultisig()) {
    for (var mi = 0; mi < state.multisigs.length; mi++) {
      var ms = state.multisigs[mi];
      var msBrands = [];
      var msSeeds = ms.seeds || [];
      for (var si = 0; si < msSeeds.length; si++) {
        var sd = state.seeds[msSeeds[si]];
        if (!sd) continue;
        for (var di = 0; di < (sd.devices || []).length; di++) {
          var dv = state.devices[sd.devices[di]];
          if (dv) { var br2 = hwBrand(dv.model); if (msBrands.indexOf(br2) < 0) msBrands.push(br2); }
        }
      }
      if (msBrands.length === 1 && msBrands[0] !== 'Andere') {
        var altRecs = [];
        if (msBrands[0] !== 'Specter') altRecs.push('Specter Shield');
        if (msBrands[0] !== 'Coldcard') altRecs.push('Coldcard');
        if (msBrands[0] !== 'Passport') altRecs.push('Passport');
        tips.push({ title:L('secTitle7'), body:Lf('secBody7fn',esc(ms.name||('Multisig '+(mi+1))),esc(msBrands[0]),esc(altRecs.slice(0,2).join(' / '))), links:[
          {text:'Hardware Wallets', url:shopUrl('products')}
        ]});
        break;
      }
    }
  }

  if (state.devices.length >= 2 && !hasMultisig()) {
    tips.push({ title:Lf('secTitle8fn',state.devices.length), body:Lf('secBody8fn',state.devices.length), links:[
      {text:'Sparrow Wallet', url:'https://sparrowwallet.com'},
      {text:'Specter Desktop', url:'https://specter.solutions'}
    ]});
  }

  // 8b. Kein automatischer Vererbungsmechanismus vorhanden
  if (!anyLianaCompanion() && !state.timelock.use && !hasMultisig()) {
    tips.push({
      title: tr('Automatischen Vererbungsmechanismus in Betracht ziehen','Consider an automatic inheritance mechanism'),
      body: tr('Aktuell ist kein Mechanismus erfasst, der deinen Erben nach einer gewissen Zeit automatisch Zugriff ermöglicht (Multisig, Timelock Recovery oder eine Liana Wallet mit Recovery-Pfad). Ohne so einen Mechanismus hängt die Vererbung vollständig davon ab, dass Erben diesen Plan finden und korrekt anwenden. Liana Wallet erlaubt z. B. einen Recovery-Pfad, der nach festgelegter Inaktivität nutzbar wird – ohne den Primärschlüssel.','No mechanism is currently recorded that automatically gives your heirs access after a certain time (multisig, timelock recovery, or a Liana wallet with a recovery path). Without such a mechanism, inheritance depends entirely on heirs finding and correctly applying this plan. Liana Wallet, for example, allows a recovery path that becomes usable after a defined period of inactivity – without the primary key.'),
      links: [
        {text: 'Liana Wallet', url: LIANA_WEBSITE},
        {text: 'Timelock Recovery', url: TIMELOCK_WEBSITE}
      ]
    });
  }

  // 8c. Liana: Wallet-Descriptor-Backup-Abdeckung (nur Offline-Modus, nur als End-Empfehlung,
  // keine direkte Inline-Rueckmeldung im Liana-Schritt selbst).
  if (state.offline && state.lianaWallets.length > 0 && anyLianaCompanion()) {
    for (var lb8c = 0; lb8c < state.lianaWallets.length; lb8c++) {
      var lwb8c = state.lianaWallets[lb8c];
      if (lwAllSeedIdxs(lb8c).length === 0) continue;
      var stlw8c = lwDescStatus(lb8c);
      var lwLabel8c = esc(lwb8c.name || ('Liana Wallet ' + (lb8c + 1)));
      if (stlw8c.level === 'err') {
        tips.push({
          title: tr('Liana Wallet „','Liana wallet "') + lwLabel8c + tr('": Wallet-Descriptor sichern','": back up the wallet descriptor'),
          body: stlw8c.msg + tr(' Optionen: auf Hardware-Wallets registrieren, Seed-Backups beilegen, im Passwort-Manager speichern, oder die Liana Wallet selbst lokal speichern lassen.',' Options: register on hardware wallets, include with seed backups, store in the password manager, or let the Liana wallet store it locally.'),
          warn: true
        });
      } else if (stlw8c.level === 'warn') {
        tips.push({
          title: tr('Liana Wallet „','Liana wallet "') + lwLabel8c + tr('": Wallet-Descriptor bei allen Backups ergänzen','": add the wallet descriptor to all backups'),
          body: stlw8c.msg,
          warn: true
        });
      }
    }
  }

  // 8d. Liana ohne Taproot -> Privacy-Hinweis (Tapscript)
  if (state.lianaWallets.length > 0 && anyLianaCompanion() && state.addrTypes.indexOf('Taproot (bc1p…)') < 0) {
    tips.push({
      title: tr('Privatsphäre: Liana Wallet mit Taproot statt Native SegWit nutzen','Privacy: use a Liana wallet with Taproot instead of Native SegWit'),
      body: tr('Deine Liana Wallet nutzt aktuell kein Taproot-Adressformat. Bei Taproot wird die Miniscript-Policy als sogenannter <strong>Tapscript</strong>-Baum abgelegt: Beim Ausgeben wird nur der tatsächlich genutzte Spending Path (z. B. der Primärpfad) auf der Blockchain sichtbar – alle anderen Pfade (z. B. die Recovery-Pfade samt deren Schlüsseln und Timelocks) bleiben verborgen, solange sie nicht verwendet werden. Ohne Taproot (z. B. bei Native SegWit/wsh) wird dagegen bei jeder Ausgabe die <strong>komplette Policy inkl. aller Pfade</strong> offengelegt – unabhängig davon, welcher Pfad tatsächlich genutzt wird. Das verrät Außenstehenden mehr über deine Vererbungsstruktur (Anzahl Recovery-Pfade, Timelocks, beteiligte Schlüssel) als nötig. Empfehlung: Taproot-Adressformat aktivieren.','Your Liana wallet currently does not use the Taproot address format. With Taproot, the Miniscript policy is stored as a so-called <strong>Tapscript</strong> tree: when spending, only the spending path actually used (e.g. the primary path) is visible on the blockchain – all other paths (e.g. the recovery paths including their keys and timelocks) remain hidden as long as they are not used. Without Taproot (e.g. Native SegWit/wsh), the <strong>complete policy including all paths</strong> is revealed on every spend – regardless of which path is actually used. That reveals more about your inheritance structure (number of recovery paths, timelocks, participating keys) to outsiders than necessary. Recommendation: enable the Taproot address format.'),
      links: [
        {text: 'Liana Wallet', url: LIANA_WEBSITE}
      ]
    });
  }

  var NO_SE_MODELS = ['Trezor One', 'Trezor T'];
  var noSeFound = [];
  for (var i = 0; i < state.devices.length; i++) {
    var m10 = state.devices[i].model || '';
    if (NO_SE_MODELS.indexOf(m10) >= 0 && noSeFound.indexOf(m10) < 0) noSeFound.push(m10);
  }
  if (noSeFound.length > 0) {

  var upgradeableBrands = [];

    var mA1 = state.devices[i].model || '';

    if ((brA1==='BitBox'||brA1==='Ledger'||brA1==='Trezor'||brA1==='Keepkey') && upgradeableBrands.indexOf(brA1)<0) upgradeableBrands.push(brA1);
  }
  if (upgradeableBrands.length > 0) {
    tips.push({ title:L('secTitle11'), body:Lf('secBody11fn',esc(upgradeableBrands.join(' / '))), links:[

  // ── 7b. Multisig: Wallet-Descriptor-Backup-Abdeckung (nur Offline-Modus) ──
  // WICHTIG: Diese Warnung erscheint AM ENDE unter "Tipps zur Bitcoin-Sicherheit".
  if (state.offline && hasMultisig()) {
    for (var mb7b = 0; mb7b < state.multisigs.length; mb7b++) {
      var msb7b = state.multisigs[mb7b];

      var st7b = msDescStatus(mb7b);

          title: tr('Multisig „','Multisig "') + esc(msb7b.name || ('Multisig ' + (mb7b + 1))) + tr('": Wallet-Descriptor bei jedem Backup ergänzen','": add the wallet descriptor to every backup'),
          body: st7b.msg,

        });
      } else if (st7b.level === 'warn') {
        tips.push({
          title: tr('Multisig „','Multisig "') + esc(msb7b.name || ('Multisig ' + (mb7b + 1))) + tr('": Wallet-Descriptor bei Seed-Phrase-Backups ergänzen','": add the wallet descriptor to seed phrase backups'),
          body: tr('Bei','For') + ' <strong>' + esc(msb7b.name || ('Multisig ' + (mb7b + 1))) + '</strong> (' + msb7b.m + '-' + tr('von','of') + '-' + msb7b.n + '): ' + st7b.msg,
