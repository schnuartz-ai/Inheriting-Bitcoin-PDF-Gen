name: App (Android and iOS)

# The app (folder app/) is built from the same web files as the website (index.html, diagram.*, assets/)
# plus the app-only files in app/src. This workflow therefore runs on changes to app/ AND to the shared
# web files. The website itself is published by sync-to-clavastack.yml, not by this workflow.
#
# To publish: push a tag like "app-v1.2.3". The "release" job then creates a GitHub release with the Android build.
on:
  push:
    branches: [master]
    tags: ['app-v*']
    paths: ['app/**', 'index.html', 'diagram.js', 'diagram.css', 'assets/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'index.html', 'diagram.js', 'diagram.css', 'assets/**', '.github/workflows/app.yml']
  workflow_dispatch: {}

# Least privilege by default. Only the release job below asks for more.
permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Check and build web part
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          for f in src/*.js ../diagram.js scripts/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: App files must not leak into the website
        working-directory: .
        run: |
          if grep -nE "planner-extras|app-shell|IS_NATIVE" index.html | grep -vE "app extension point|window.IS_NATIVE"; then
            echo "::error::index.html references app files. The website must work without them."; exit 1
          fi
      - run: npm run build:www

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    env:
      # Signing secrets are only handed to builds on master and on tags, never to pull requests:
      # a pull request could change this workflow and read them.
      KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_B64 || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android SDK (the runner image already ships the SDK)
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Set version (release tag name, otherwise 1.0.<run number>)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then NAME="${GITHUB_REF_NAME#app-v}"; else NAME="1.0.${{ github.run_number }}"; fi
          NAME="$(printf '%s' "$NAME" | tr -cd '0-9A-Za-z.+-')"
          echo "APP_VERSION=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_ARGS=-PappVersionCode=${{ github.run_number }} -PappVersionName=$NAME" >> "$GITHUB_ENV"
      - run: npm run sync
      - name: Debug APK (for testing, not suitable for updates)
        working-directory: app/android
        run: ./gradlew assembleDebug $VERSION_ARGS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
      - name: Signed release builds (only when a signing key is configured)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          printf 'storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew assembleRelease bundleRelease $VERSION_ARGS
      - name: Remove signing material from the runner
        if: ${{ always() && env.KEYSTORE_B64 != '' }}
        working-directory: app/android
        run: rm -f release.keystore keystore.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ env.KEYSTORE_B64 != '' }}
        with:
          name: android-release
          path: |
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS (compile check)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO build

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ls dist/android-release/apk/release/*.apk >/dev/null 2>&1; then
            FILES="dist/android-release/apk/release/*.apk dist/android-release/bundle/release/*.aab"
            NOTE="Signed Android app (APK for direct installation, AAB for Google Play)."
            FLAGS=""
          else
            FILES="dist/android-debug-apk/*.apk"
            NOTE="Test build (debug-signed). Use the signed builds for updates across versions once the signing key is configured."
            FLAGS="--prerelease"
          fi
          # Checksums let users verify the download (sha256sum -c SHA256SUMS.txt)
          mkdir -p out && cp $FILES out/
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Bitcoin Inheritance Planner ${TAG#app-v}" --notes "$NOTE" $FLAGS
