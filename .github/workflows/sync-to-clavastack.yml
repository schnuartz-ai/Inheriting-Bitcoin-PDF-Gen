name: Sync index.html to ClavaStack website

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tool repo
        uses: actions/checkout@v4

      - name: Clone ClavaStack website repo
        run: |
          git clone https://x-access-token:${{ secrets.CLAVASTACK_WEBSITE_TOKEN }}@github.com/Schnuartz/next-clavastack.git

      - name: Copy index.html and assets
        run: |
          cp index.html next-clavastack/public/inheritance-planner/index.html
          mkdir -p next-clavastack/public/inheritance-planner/assets
          rsync -a --delete assets/ next-clavastack/public/inheritance-planner/assets/

      - name: Commit and push if changed
        run: |
          cd next-clavastack
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/inheritance-planner/index.html public/inheritance-planner/assets
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "sync: update inheritance-planner from tool repo"
          git push
